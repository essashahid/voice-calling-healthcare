<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Proposal for phone coverage and patient follow-up at an ophthalmology clinic: implementation options, detailed scope, delivery plan, estimated vendor costs and terms.">
  <meta name="robots" content="noindex, nofollow">
  <title>Clinic Phone Proposal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <style>
    /* Layout: one shared 1520px grid (header, sections, footer); tables, comparison and timeline use the full width, running text is capped near 70ch. Serif for section titles and prices, Plex Sans for everything read or compared.
       One bordered comparison panel for the options; everything else is rules, tables and open space. */
    :root{
      color-scheme:light;
      --bg:#f6f7f8;--surface:#ffffff;--ink:#16202a;--muted:#4b5865;--line:#dde2e7;--line-strong:#aab5c0;
      --accent:#1c5871;--accent-tint:#edf4f7;--accent-line:#8db0c0;
      --serif:"Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
      --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
      --max:1520px;--gutter:clamp(32px,3.2vw,48px);
    }
    @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101519;--surface:#161d23;--ink:#e4e9ed;--muted:#a3afba;--line:#27313a;--line-strong:#4a5661;--accent:#89c0d7;--accent-tint:#15262f;--accent-line:#3f6d81}}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#101519;--surface:#161d23;--ink:#e4e9ed;--muted:#a3afba;--line:#27313a;--line-strong:#4a5661;--accent:#89c0d7;--accent-tint:#15262f;--accent-line:#3f6d81}

    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:20px;-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
    h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
    ul,ol{padding:0;list-style:none}
    button,select{font:inherit;color:inherit}
    a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
    a:hover{text-decoration-thickness:2px}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .skip{position:absolute;left:16px;top:-60px;background:var(--ink);color:var(--bg);padding:8px 14px;z-index:5}
    .skip:focus{top:12px}
    .wrap{max-width:calc(var(--max) + 2*var(--gutter));margin-inline:auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
    .lbl{display:block;font-size:13px;line-height:1.4;color:var(--muted)}
    .no{color:var(--muted)}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent)}
    .table-wrap{overflow-x:auto}
    table{border-collapse:collapse;width:100%}
    th{text-align:left;font-weight:600}

    /* Header */
    .site-header{border-bottom:1px solid var(--line)}
    .header-inner{display:flex;align-items:center;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;padding-block:16px}
    .identity{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none}
    .avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
    .footer-inner .avatar{width:28px;height:28px}
    .header-right{display:flex;align-items:center;gap:10px 24px;flex-wrap:wrap}
    .doc-meta{display:flex;flex-wrap:wrap;gap:2px 20px;font-size:13px;color:var(--muted)}
    .doc-meta b{font-weight:500;color:var(--ink)}
    .controls{display:flex;gap:8px}
    .ctl{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font-size:13px;cursor:pointer}
    .ctl:hover{border-color:var(--ink)}
    .ctl svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

    /* Overview */
    .overview{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px 64px;padding-block:56px 48px;align-items:end}
    .kicker{font-size:15px;font-weight:500;color:var(--accent)}
    h1{font:600 clamp(34px,4vw,48px)/1.08 var(--serif);letter-spacing:-.015em;margin-top:10px;text-wrap:balance}
    .overview .lede{font-size:18px;line-height:1.62;max-width:68ch}
    .overview .lede+.lede{margin-top:14px;color:var(--muted);font-size:17px}
    .toc{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 28px;padding-top:20px;border-top:1px solid var(--line);font-size:15px}

    /* Sections */
    .section{padding-block:56px}
    .section+.section{border-top:1px solid var(--line)}
    .sec-head{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:12px 64px;align-items:baseline;margin-bottom:32px}
    h2{font:600 clamp(26px,2.6vw,32px)/1.15 var(--serif);letter-spacing:-.01em;text-wrap:balance}
    .sec-head p{font-size:16px;color:var(--muted);max-width:64ch}
    .sec-head p+p{margin-top:8px}
    h3.sub{font:600 18px/1.35 var(--sans);margin-bottom:6px}
    .sub-lede{font-size:15px;color:var(--muted);margin-bottom:16px;max-width:72ch}
    .part+.part{margin-top:48px;padding-top:32px;border-top:1px solid var(--line)}

    /* Options comparison */
    .cmp{display:grid;grid-template-columns:200px repeat(3,minmax(0,1fr));grid-template-rows:repeat(6,auto);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px 10px 0 0;overflow:hidden}
    .cmp-labels,.opt{grid-row:1/span 6;display:grid;grid-template-rows:subgrid;min-width:0}
    .cmp-labels{background:var(--bg)}
    .cmp-labels>*,.opt>*{padding:16px 22px;border-top:1px solid var(--line)}
    .cmp-labels>:first-child,.opt>:first-child{border-top:0}
    .cmp-labels>*{font-size:14px;font-weight:500;color:var(--muted)}
    .opt{border-left:1px solid var(--line)}
    .opt.rec{background:var(--accent-tint);box-shadow:inset 0 3px 0 var(--accent)}
    .opt-head{padding-top:22px!important}
    .opt-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
    .opt-top .rec-label{color:var(--accent);font-weight:600}
    .opt h3{font:600 24px/1.2 var(--serif);margin-top:4px}
    .opt .desc{font-size:15px;color:var(--muted);margin-top:4px}
    .price{font:600 40px/1.05 var(--serif);letter-spacing:-.01em}
    .price-sub{font-size:13px;color:var(--muted);margin-top:6px}
    .big{font:600 20px/1.3 var(--sans)}
    .big small{font-size:14px;font-weight:400;color:var(--muted)}
    .opt .txt{font-size:15px;line-height:1.5}
    .opt .txt.out{color:var(--muted)}
    .cell-lbl{display:none}
    .cmp-foot{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line-strong);border-top:0;border-radius:0 0 10px 10px;background:var(--bg)}
    .cmp-foot>*{padding:14px 22px}
    .cmp-foot h3{font:500 14px/1.5 var(--sans);color:var(--muted)}
    .incl{display:flex;flex-wrap:wrap;gap:6px 28px;font-size:14.5px}
    .incl li{position:relative;padding-left:14px}
    .incl li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
    .cmp-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 48px;margin-top:18px;font-size:14px;color:var(--muted)}
    .cmp-notes p{max-width:80ch}
    .cmp-notes strong{color:var(--ink);font-weight:600}

    /* Scope */
    .scope-tools{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;margin-bottom:12px;font-size:14px;color:var(--muted)}
    .linkbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer}
    .linkbtn:hover{border-color:var(--ink)}
    .srow{display:grid;grid-template-columns:minmax(0,1fr) 92px 150px 128px 34px 34px 34px 28px;align-items:center;column-gap:12px}
    .scope-head{padding:10px 0;border-bottom:1px solid var(--ink);font-size:13px;font-weight:500;color:var(--muted)}
    .scope-head .c{text-align:center}
    .grp{font:600 15px/1.4 var(--sans);color:var(--accent);padding:26px 0 8px;border-bottom:1px solid var(--line-strong)}
    .it{border-bottom:1px solid var(--line)}
    .it>summary{list-style:none;cursor:pointer;padding:14px 0;font-size:15px}
    .it>summary::-webkit-details-marker{display:none}
    .it>summary:hover .nm>span:last-child{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
    .it>summary:focus-visible{outline-offset:-2px}
    .nm{font-weight:600;display:flex;gap:10px;min-width:0}
    .no-tag{min-width:2.2em;color:var(--muted);font-weight:500}
    .money{font-weight:600}
    .s-sub{display:block;font-size:13px;color:var(--muted);line-height:1.35}
    .srow .c{text-align:center}
    .chev{width:14px;height:14px;justify-self:end;transition:transform .15s;stroke:var(--muted);fill:none;stroke-width:2}
    .it[open] .chev{transform:rotate(180deg)}
    .it-body{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px 32px;padding:4px 0 20px calc(2.2em + 10px);font-size:14.5px;line-height:1.55}
    .it-body .note{display:block;color:var(--muted);font-style:italic;margin-top:6px;font-size:14px}
    .it-body .lbl{font-weight:500;margin-bottom:3px}
    .m-meta{display:none}
    .gates p{max-width:72ch}
    .gates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 48px;margin-top:24px;font-size:14.5px;color:var(--muted)}
    .gates strong{color:var(--ink);font-weight:600}

    /* Delivery */
    .flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
    .flow li{position:relative;padding:12px 26px 0 0;border-top:2px solid var(--line-strong)}
    .flow li:not(:last-child)::after{content:"";position:absolute;top:-6px;right:12px;width:9px;height:9px;border-top:2px solid var(--line-strong);border-right:2px solid var(--line-strong);transform:rotate(45deg)}
    .flow li.ai{border-top-color:var(--accent)}
    .flow strong{display:block;font-size:15px}
    .flow p{font-size:14px;color:var(--muted);margin-top:2px}
    .emerg{margin-top:16px;font-size:14.5px;color:var(--muted)}
    .emerg strong{color:var(--ink)}
    .tl{display:grid;grid-template-columns:110px repeat(8,minmax(0,1fr));row-gap:8px}
    .tl .wk{padding:0 10px 10px;border-left:1px solid var(--line);font-size:13.5px;line-height:1.4}
    .tl .wk b{display:block;font-size:13px;font-weight:500;color:var(--muted)}
    .tl .wk .t{display:block;font-weight:600}
    .tl .wk small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
    .tl .vn{grid-column:1;font-size:14px;font-weight:500;align-self:center}
    .tl .bar{grid-column-start:2;height:28px;border-radius:4px;background:var(--accent-tint);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:flex-end;padding:0 10px;font-size:13px;font-weight:600;white-space:nowrap}
    .weeklist{display:none;grid-template-columns:1fr 1fr;gap:10px 20px;margin-top:16px;font-size:14px}
    .weeklist b{display:block}
    .weeklist span{color:var(--muted)}
    .deps{font-size:14.5px;border-top:1px solid var(--ink)}
    .deps thead th{font-size:13px;font-weight:500;color:var(--muted);padding:10px 16px 10px 0;border-bottom:1px solid var(--line-strong)}
    .deps td,.deps tbody th{padding:11px 16px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
    .deps tbody th{font-weight:500;width:46%}
    .deps td:nth-child(2){width:24%;color:var(--muted)}

    /* Costs, security, terms */
    .costs{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 40px}
    .costs-head{grid-column:1/-1}
    .num{font-size:14.5px;border-top:1px solid var(--ink)}
    .num thead th{font-size:13px;font-weight:500;color:var(--muted);padding:10px 0 10px 12px;border-bottom:1px solid var(--line-strong);text-align:right;white-space:nowrap}
    .num thead th:first-child{text-align:left;padding-left:0}
    .num td,.num tbody th,.num tfoot th{padding:9px 0 9px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;white-space:nowrap}
    .num tbody th,.num tfoot th{text-align:left;padding-left:0;font-weight:500;white-space:normal}
    .num th small{display:block;font-size:13px;color:var(--muted);font-weight:400}
    .num tfoot th,.num tfoot td{font-weight:600;border-top:1px solid var(--ink);border-bottom:0}
    .notes{font-size:14.5px;color:var(--muted);margin-top:14px;max-width:72ch}
    .notes li+li{margin-top:8px}
    .notes strong{color:var(--ink);font-weight:600}
    .vend{font-size:14.5px;border-top:1px solid var(--ink)}
    .vend thead th{font-size:13px;font-weight:500;color:var(--muted);padding:10px 16px 10px 0;border-bottom:1px solid var(--line-strong)}
    .vend td,.vend tbody th{padding:11px 16px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
    .vend tbody th{width:19%}
    .vend td:nth-child(2){width:34%}
    .vend .st{display:block;font-weight:600}
    .vend .dt{display:block;color:var(--muted);font-size:14px}
    .sec-notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 48px;margin-top:20px;font-size:14.5px;color:var(--muted)}
    .sec-notes p{max-width:60ch}
    .sec-notes strong{display:block;color:var(--ink);font-weight:600}
    .terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 64px}
    .terms>div{padding:14px 0;border-top:1px solid var(--line)}
    .terms dt{font-weight:600;font-size:15px}
    .terms dd{font-size:14.5px;color:var(--muted);margin-top:2px;max-width:70ch}
    @media screen and (min-width:1360px){.cmp-notes{grid-template-columns:1fr}}


    .site-footer{border-top:1px solid var(--line)}
    .footer-inner{display:flex;justify-content:space-between;align-items:center;gap:10px 24px;flex-wrap:wrap;padding-block:22px 36px;font-size:13px;color:var(--muted)}
    .footer-inner .identity{font-size:14px}
    .error{max-width:720px;margin:64px auto;padding:24px;border:1px solid var(--ink)}

    @media screen and (max-width:1100px){
      .cmp{grid-template-columns:160px repeat(3,minmax(0,1fr))}
      .cmp-labels>*,.opt>*{padding:14px 16px}
      .cmp-foot{grid-template-columns:160px minmax(0,1fr)}
      .cmp-foot>*{padding:14px 16px}
      .price{font-size:34px}
      .srow{grid-template-columns:minmax(0,1fr) 84px 130px 116px 30px 30px 30px 24px;column-gap:10px}
      .sec-notes{grid-template-columns:1fr 1fr}
    }
    @media screen and (max-width:900px){
      :root{--gutter:24px}
      .overview,.sec-head{grid-template-columns:1fr}
      .overview{padding-block:40px 36px;gap:16px}
      .sec-head{margin-bottom:24px}
      .cmp{grid-template-columns:1fr;grid-template-rows:none;border:0;background:transparent;border-radius:0;overflow:visible;gap:14px}
      .cmp-labels{display:none}
      .opt{grid-row:auto;grid-template-rows:none;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
      .opt.rec{background:var(--accent-tint);border-color:var(--accent);box-shadow:none}
      .opt>*{padding:12px 16px}
      .opt-head,.opt .pr,.opt .inc,.opt .exc{grid-column:1/-1}
      .opt .mo{border-left:1px solid var(--line)}
      .cell-lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
      .cmp-foot{grid-template-columns:1fr;margin-top:14px;border-top:1px solid var(--line-strong);border-radius:10px}
      .cmp-foot>*+*{padding-top:0}
      .cmp-notes,.gates,.costs,.terms{grid-template-columns:1fr}
      .costs{gap:28px}
      .scope-head{display:none}
      .it>summary.srow{grid-template-columns:minmax(0,1fr) 20px;row-gap:4px}
      .it>summary .d{display:none}
      .m-meta{display:block;grid-column:1;font-size:14px;color:var(--muted);padding-left:calc(2.2em + 10px)}
      .m-meta b{color:var(--ink);font-weight:600}
      .chev{grid-column:2;grid-row:1}
      .it-body{grid-template-columns:1fr;gap:12px}
      .flow{grid-template-columns:1fr}
      .flow li{border-top:0;border-left:2px solid var(--line-strong);padding:0 0 14px 16px}
      .flow li.ai{border-left-color:var(--accent)}
      .flow li:not(:last-child)::after{display:none}
      .tl{grid-template-columns:44px repeat(8,minmax(0,1fr))}
      .tl .wk{padding:0 4px 8px}
      .tl .wk b .w{display:none}
      .tl .wk .t,.tl .wk small{display:none}
      .tl .bar{padding:0 6px;font-size:12px}
      .tl .bar .w{display:none}
      .weeklist{display:grid}
      .sec-notes{grid-template-columns:1fr}
    }
    @media screen and (max-width:600px){
      :root{--gutter:16px}
      .doc-meta{order:2;width:100%}
      .header-right{width:100%;justify-content:space-between}
      .section{padding-block:40px}
      .overview .lede{font-size:17px}
      .weeklist{grid-template-columns:1fr}
      .deps thead,.vend thead{display:none}
      .deps tr,.vend tr{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
      .deps td,.deps tbody th,.vend td,.vend tbody th{display:block;width:auto!important;padding:0;border:0}
      .deps td,.vend td{margin-top:3px}
      .deps td[data-lbl]::before{content:attr(data-lbl) ": ";color:var(--muted)}
    }
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chev{transition:none}}

    @page{size:Letter;margin:12mm 13mm 13mm}
    @media print{
      :root,:root[data-theme="dark"],:root:not([data-theme="light"]){color-scheme:light;--bg:#ffffff;--surface:#ffffff;--ink:#111a22;--muted:#3e4a56;--line:#d5dbe1;--line-strong:#9ca8b4;--accent:#1c5871;--accent-tint:#eef4f7;--accent-line:#8db0c0;--gutter:0px}
      body{font-size:9.5pt;line-height:1.42;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .skip,.controls,.toc,.chev,.linkbtn,.weeklist,.m-meta{display:none!important}
      a{color:inherit;text-decoration:none}
      .wrap{max-width:none;padding:0}
      .header-inner{padding-block:0 6pt}
      .doc-meta{font-size:8.5pt}
      .overview{grid-template-columns:5fr 7fr;gap:24pt;padding-block:14pt 12pt}
      .kicker{font-size:9pt}
      h1{font-size:24pt}
      .overview .lede{font-size:10pt}.overview .lede+.lede{font-size:9.5pt;margin-top:5pt}
      .section{padding-block:10pt 12pt}
      .sec-head{grid-template-columns:5fr 7fr;gap:6pt 24pt;margin-bottom:10pt;break-inside:avoid;break-after:avoid}
      h2{font-size:17pt}
      .sec-head p{font-size:9pt}
      h3.sub{font-size:11pt;margin-bottom:3pt;break-after:avoid}
      .sub-lede{font-size:9pt;margin-bottom:6pt}
      .part+.part{margin-top:10pt;padding-top:8pt}
      .cmp{grid-template-columns:96pt repeat(3,minmax(0,1fr));break-inside:avoid}
      .cmp-labels>*,.opt>*{padding:6pt 9pt}
      .opt-head{padding-top:8pt!important}
      .cmp-labels>*{font-size:8.5pt}
      .opt h3{font-size:14pt}
      .opt .desc,.opt .txt{font-size:8.8pt}
      .opt-top{font-size:8.5pt}
      .price{font-size:22pt}
      .price-sub{font-size:8pt;margin-top:2pt}
      .big{font-size:11.5pt}.big small{font-size:8.5pt}
      .cmp-foot{grid-template-columns:96pt 1fr;break-inside:avoid}
      .cmp-foot>*{padding:6pt 9pt}
      .cmp-foot h3{font-size:8.5pt}
      .incl{font-size:8.8pt;gap:2pt 16pt}
      .cmp-notes{font-size:8.5pt;margin-top:8pt;gap:6pt 24pt}
      .scope-tools{font-size:8.5pt;margin-bottom:4pt}
      .srow{grid-template-columns:minmax(0,1fr) 56pt 96pt 76pt 20pt 20pt 20pt}
      .scope-head{font-size:8pt;padding:5pt 0}
      .scope-head>span:last-child{display:none}

        <div><dt>Support and monitoring</dt><dd>Support starts when the selected version is accepted as live: ${s.firstSupportMonths} month in every version, ${supportTotal()} months in Version 3. It covers fixes and agreed workflow support; new features are additional scope. Monitoring is automated with alerts to named owners, not continuous human support.</dd></div>
        <div><dt>Scope changes</dt><dd>A different integration route, changes to vendor access or work beyond the accepted scope need agreement on scope, price and schedule before that work starts.</dd></div>
        <div><dt>Consent</dt><dd>AI callbacks go only to callers with call consent on file. The clinic confirms the source and permitted use of that consent, including before ModMed is connected. Recall and win-back activity require the clinic’s confirmation of consent and suppression rules.</dd></div>
        <div><dt>Access</dt><dd>${escape(PROPOSAL.accessPolicy)}</dd></div>
        <div><dt>Clinic responsibilities</dt><dd>Provide the required access, vendor agreements, approved scripts and emergency instructions, consent records and staff reviewers; confirm hours, report recipients, retention rules and booking permissions at onboarding.</dd></div>
        <div><dt>Ownership</dt><dd>The clinic keeps its accounts and data. Configuration, operating notes and staff handover are included. Third-party software stays under its vendor agreements.</dd></div>
        <div><dt>Not included in the build price</dt><dd>Vendor subscriptions and usage, partner or API charges, messaging registration, taxes, clinic IT time and legal review.</dd></div>
        <div><dt>Validity</dt><dd>This quote is valid until ${date(m.validUntil)}.</dd></div>
      </dl>
    </div>
  </div></section>

</main>
<footer class="site-footer"><div class="wrap footer-inner"><span class="identity"><img class="avatar" src="${m.photo}" alt="" width="32" height="32">${escape(m.author)}</span><span>Quote ${escape(m.number)} · Valid until ${date(m.validUntil)}</span></div></footer>`;
        root.dataset.quoteValidated="true";
      }

      const THEME_KEY="clinic-proposal-theme";
      const systemDark=matchMedia("(prefers-color-scheme: dark)");
      const effectiveTheme=()=>root.dataset.theme||(systemDark.matches?"dark":"light");
      function syncThemeButton() {
        const dark=effectiveTheme()==="dark";
        const button=$("#theme-toggle");
        if(!button) return;
        button.innerHTML=`${icons[dark?"sun":"moon"]}<span>${dark?"Light":"Dark"}</span>`;
        button.setAttribute("aria-label",`Switch to ${dark?"light":"dark"} theme`);
      }
      const details=()=>Array.from(document.querySelectorAll("details.it"));
      function syncExpandButton(){const b=$("#expand-all");if(!b)return;const all=details().every(d=>d.open);b.textContent=all?"Collapse all":"Expand all";b.setAttribute("aria-expanded",String(all));}
      let printOpened=[];
      function openForPrint(){printOpened=details().filter(d=>!d.open);printOpened.forEach(d=>d.open=true);}
      function restoreAfterPrint(){printOpened.forEach(d=>d.open=false);printOpened=[];syncExpandButton();}
      try {
        validateAndBuild();
        try{const saved=localStorage.getItem(THEME_KEY);if(saved==="light"||saved==="dark")root.dataset.theme=saved;}catch{}
        render();
        syncThemeButton();
        syncExpandButton();
        systemDark.addEventListener("change",syncThemeButton);
        $("#theme-toggle").addEventListener("click",()=>{const next=effectiveTheme()==="dark"?"light":"dark";root.dataset.theme=next;try{localStorage.setItem(THEME_KEY,next);}catch{}syncThemeButton();});
        $("#print-button").addEventListener("click",async()=>{if(document.fonts)await document.fonts.ready;window.print();});
        $("#expand-all").addEventListener("click",()=>{const open=!details().every(d=>d.open);details().forEach(d=>d.open=open);syncExpandButton();});
        details().forEach(d=>d.addEventListener("toggle",syncExpandButton));
        addEventListener("beforeprint",openForPrint);
        addEventListener("afterprint",restoreAfterPrint);
        matchMedia("print").addEventListener("change",e=>e.matches?openForPrint():restoreAfterPrint());
      } catch(error) {
        console.error(error);
        $("#app").innerHTML='<div class="error" role="alert"><h1>The quote needs a data check.</h1><p>A price or scope entry could not be validated. Check the PROPOSAL object before sharing this page.</p></div>';
      }
    })();
  </script>
</body>
</html>
