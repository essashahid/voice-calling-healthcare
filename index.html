      const cents = (v) => Math.round(v*100);
      const sum = (a) => a.reduce((x,y)=>x+y,0);
      const icon = (name) => ({moon:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>',sun:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>',print:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7zM17 11h.01"/></svg>',arrow:'<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg>'})[name];

      const voiceMinutes = sum(Object.values(voice));

      const eligibilityCost = (cents(Math.min(PROPOSAL.assumptions.eligibilityChecks,PROPOSAL.rates.eligibilityFirst.count)*PROPOSAL.rates.eligibilityFirst.rate) + cents(Math.max(0,PROPOSAL.assumptions.eligibilityChecks-PROPOSAL.rates.eligibilityFirst.count)*PROPOSAL.rates.eligibilityNext))/100;
      function monthlyBudget(item) {

        features+=v.excluded.map(t=>`<li class="excluded"><span aria-hidden="true">−</span><span><span class="sr-only">Not included: </span>${escape(t)}</span></li>`).join("");
        const prior=v.base?model.get(v.base):null;
        return `<article class="plan ${v.recommended?"recommended":""}" aria-labelledby="title-${v.id}" data-version="${v.id}" data-price="${v.price}" data-value="${v.value}" data-savings="${v.savings}" data-monthly-low="${v.monthly[0]}" data-monthly-high="${v.monthly[1]}"><div class="plan-topline"><span class="plan-label">Version ${v.number} / ${escape(v.label)}</span>${v.recommended?'<span class="recommendation">Recommended · Best value</span>':""}</div><h3 id="title-${v.id}">${escape(v.name)}</h3><p class="plan-tagline">${escape(v.tagline.replace("{weeks}",v.weeks))}</p><p class="plan-price">${dollars(v.price)}</p><p class="price-kind">One-time build · USD</p><div class="value-line"><s>${dollars(v.value)}</s><span>at item prices</span><span class="save">Save ${dollars(v.savings)}</span></div><dl class="plan-stats"><div><dt>Target go-live</dt><dd>${v.weeks} weeks</dd></div><div><dt>Est. vendor cost / month</dt><dd>${range(v.monthly)}</dd></div></dl><ul class="plan-includes">${features}</ul><p class="plan-fit"><strong>${escape(v.fit)}</strong>${escape(v.fitDetail)}</p>${v.recommended?`<p class="upgrade-note">${dollars(v.price-prior.price)} more than V${prior.number} adds ${dollars(v.value-prior.value)} in item-priced scope.</p>`:""}<a class="plan-cta" href="#acceptance" data-select-version="${v.id}">Review Version ${v.number}${icon("arrow")}</a></article>`;
      }
      function scopeRow(i) {
        let delivery=i.week?`Week ${i.week}`:"After go-live";
        let delivers=i.delivers;
        if(i.id==="afterhours") delivers+=` Report at ${PROPOSAL.settings.morningReport}, ${PROPOSAL.settings.clinicTimezone.toLowerCase()}.`;
        if(i.id==="dashboard") delivers+=` Sent ${PROPOSAL.settings.weeklyReport}.`;
        if(i.id==="support") delivers=`${PROPOSAL.settings.firstSupportMonths} month of ${delivers.charAt(0).toLowerCase()+delivers.slice(1)}`;
        if(i.id==="support-extra") delivers=`${PROPOSAL.settings.extraSupportMonths} extra months of support (${PROPOSAL.settings.firstSupportMonths+PROPOSAL.settings.extraSupportMonths} total), with monthly call review and tuning.`;
        const monthly=i.monthly[1]?`${range(i.monthly)}`:escape(i.monthlyLabel||"Included");
        return `<tr role="row" class="scope-row" data-item="${i.id}"><th role="rowheader" scope="row"><span class="item-number">${i.number}</span>${escape(i.name)}</th><td role="cell" class="deliverable" data-label="What it delivers">${escape(delivers)}${i.note?`<span class="row-note">${escape(i.note)}</span>`:""}</td><td role="cell" class="price" data-label="Fixed price"><span class="money">${dollars(i.price)}</span>${i.feeNote?`<span class="fee-kind">${escape(i.feeNote)}</span>`:""}</td><td role="cell" class="delivery" data-label="Delivery target">${delivery}<small>${escape(i.deliveryNote)}</small></td><td role="cell" class="monthly" data-label="Monthly running cost">${monthly}${i.monthly[1]?'<span class="fee-kind">estimate / month</span>':""}</td><td role="cell" class="access" data-label="Access the clinic provides">${escape(i.access)}</td><td role="cell" class="accept-check" data-label="Done when">${escape(i.done)}</td><td role="cell" class="packages" data-label="Included in">${Array.from(model.values()).map(v=>`<span class="inclusion ${v.ids.includes(i.id)?"":"no"}"><span>V${v.number}</span><span>${v.ids.includes(i.id)?"Yes":"—"}<span class="sr-only">${v.ids.includes(i.id)?", included":", not included"}</span></span></span>`).join("")}</td></tr>`;
      }
      function renderScope() {
        let lastGroup="";
        return items.map(i=>{
          const group=i.group!==lastGroup?`<tr role="row" class="group-row"><th colspan="8" scope="colgroup">${escape(i.group)}</th></tr>`:"";
          lastGroup=i.group;return group+scopeRow(i);
        }).join("");
      }
      function render() {
        const s=PROPOSAL.settings,a=PROPOSAL.assumptions,r=PROPOSAL.rates,m=PROPOSAL.meta;
        document.title=m.title;
        $("#app").innerHTML=`
          <header class="site-header wrap"><div class="header-top"><a href="#main" class="identity" aria-label="${escape(m.author)}, proposal start"><span class="monogram" aria-hidden="true">${escape(m.monogram)}</span>${escape(m.author)}</a><div class="header-actions"><nav class="header-nav" aria-label="Proposal sections"><a href="#versions">Versions</a><a href="#scope">Scope</a><a href="#timeline">Delivery</a></nav><div class="utilities"><button type="button" class="utility" id="theme-toggle" aria-label="Switch to dark mode" aria-pressed="false" title="Switch color theme">${icon("moon")}</button><button type="button" class="utility" id="print-button" aria-label="Print proposal or save as PDF" title="Print / save PDF">${icon("print")}</button></div></div></div><div class="metadata"><span>Project proposal <strong>${escape(m.number)}</strong></span><div class="meta-dates"><span>Issued <strong><time datetime="${m.issued}">${date(m.issued)}</time></strong></span><span>Valid until <strong><time datetime="${m.validUntil}">${date(m.validUntil)}</time></strong></span></div></div></header>
          <main id="main" tabindex="-1">
            <section class="hero wrap" aria-labelledby="proposal-title"><div><p class="eyebrow">Ophthalmology clinic / Phone & patient communication</p><h1 id="proposal-title">A plan to capture<br><em>more patient calls.</em></h1><p class="intro">The owner’s first priority is fixing the phones. This proposal adds AI intake, timely callbacks and patient follow-up around the systems the clinic already uses.</p><div class="systems">${PROPOSAL.facts.systems.map(t=>`<span>${escape(t)}</span>`).join("")}<small>Add-on layer · no replacement</small></div></div><aside class="brief-facts" aria-label="Facts from the clinic brief"><div class="fact"><strong>~${count(PROPOSAL.facts.callsMonthly)}</strong><span>calls to the clinic each month</span></div><div class="fact"><strong>${PROPOSAL.facts.newPatientsMonthly.join("–")}</strong><span>new patients each month</span></div><div class="priority"><span class="overline">The goal</span><p>${escape(PROPOSAL.facts.priority)}</p><small>Fewer lost patient opportunities.</small></div></aside></section>
            <section class="section wrap" aria-labelledby="needs-title">${head("01",'<span id="needs-title">Six needs. A connected response.</span>',"The requested workflows, mapped to a practical next step.")}<ol class="problem-list">${PROPOSAL.problems.map(p=>`<li class="problem-row"><span class="item-index">${p.item.padStart(2,"0")}</span><h3>${escape(p.need)}</h3><span class="arrow" aria-hidden="true">→</span><p><strong>${escape(p.solution)}</strong> ${escape(p.outcome)}</p></li>`).join("")}</ol></section>
            <section id="versions" class="section options-section wrap" aria-labelledby="versions-title">${head("02",'<span id="versions-title">Three ways to move forward.</span>',"Start with the phones, cover the full brief, or add the capabilities that extend it.","One-time build fees · clinic-owned vendor accounts")}<div class="pricing-grid">${Array.from(model.values()).map(renderPlan).join("")}</div><p class="pricing-caption">Savings compare each package with the sum of the item prices below; they are not a previous sale price. Vendor costs are planning ranges paid directly by the clinic, with no markup. <a href="#running-costs">See the usage basis</a>.</p><div class="shared"><h3>Included in every version</h3><ul><li><span class="checkmark" aria-hidden="true">✓</span>24/7 automated monitoring with alerts</li><li><span class="checkmark" aria-hidden="true">✓</span>Daily encrypted database backups</li><li><span class="checkmark" aria-hidden="true">✓</span>${s.firstSupportMonths} month of post-launch support</li><li><span class="checkmark" aria-hidden="true">✓</span>HIPAA setup & US hosting</li><li><span class="checkmark" aria-hidden="true">✓</span>Audit log of calls & actions</li><li><span class="checkmark" aria-hidden="true">✓</span>Approved, limited-access connections</li></ul><p class="access-policy">${escape(PROPOSAL.accessPolicy)}</p></div></section>
            <section id="scope" class="section scope-section wide" aria-labelledby="scope-title">${head("03",'<span id="scope-title">The scope, item by item.</span>',"Each line has a delivery target, a clinic responsibility and an acceptance check. Core items retain the clinic’s original numbering.")}<div class="scope-guide"><span>Standalone build fees shown; package discounts are above.</span><span class="scroll-hint">Scroll the table to see all columns →</span></div><div class="table-scroll" tabindex="0" role="region" aria-label="Detailed scope, pricing, required access and acceptance checks"><table class="scope-table" role="table"><caption class="sr-only">Project scope. Fixed fees in US dollars; monthly figures are estimated vendor charges.</caption><colgroup><col><col><col><col><col><col><col><col></colgroup><thead role="rowgroup"><tr role="row"><th role="columnheader" scope="col">Item</th><th role="columnheader" scope="col">What it delivers</th><th role="columnheader" scope="col">Fixed price</th><th role="columnheader" scope="col">Delivery target</th><th role="columnheader" scope="col">Monthly cost</th><th role="columnheader" scope="col">Access the clinic provides</th><th role="columnheader" scope="col">Done when / acceptance check</th><th role="columnheader" scope="col">V1 / V2 / V3</th></tr></thead><tbody role="rowgroup">${renderScope()}</tbody></table></div><div class="scope-notes"><p><strong>Callback integration gate.</strong> Both proposed event / routing routes are unverified. If neither is available, a staff callback list is an optional alternative with a ${dollars(s.callbackFallbackReduction)} lower build fee. It requires written agreement and does not fulfill the requested AI callback workflow.</p><p><strong>Patient workflow gate.</strong> Items 4–6 need the approved source connections listed above. Direct booking additionally needs ModMed write access; it stays conditional until that route is approved. Standalone additions reuse the foundation and require a scheduling agreement.</p></div></section>
            <section id="architecture" class="section architecture-section wrap" aria-labelledby="stack-title">${head("04",'<span id="stack-title">A small, defined technology layer.</span>',"The clinic owns the vendor accounts. Each tool has one clear job.")}<table class="stack-table" role="table"><caption class="sr-only">Tools, responsibilities and BAA arrangements</caption><thead role="rowgroup"><tr role="row"><th role="columnheader" scope="col">Tool</th><th role="columnheader" scope="col">What it does</th><th role="columnheader" scope="col">Agreement / configuration</th></tr></thead><tbody role="rowgroup">${PROPOSAL.stack.map(t=>`<tr role="row"><th role="rowheader" scope="row">${escape(t.name)}</th><td role="cell">${escape(t.role)}</td><td role="cell"><span class="baa-status">${escape(t.status)}</span>${escape(t.detail)}</td></tr>`).join("")}</tbody></table><p class="stack-note">BAA availability is not an executed agreement or a compliance guarantee. Every tool handling patient data requires the appropriate executed BAA and approved configuration before live use. Patient data is planned for approved US-hosted systems; vendor processing, retention and access settings are verified during onboarding.</p><h3 class="flow-title">How a call reaches the team</h3><ol class="flow" aria-label="Call flow from patient through Weave and AI to staff"><li><span class="flow-num">01</span><strong>Patient call</strong><p>The patient calls the clinic’s existing number.</p></li><li><span class="flow-num">02</span><strong>Weave routing</strong><p>Surgery, approved missed-call triggers and after-hours routing.</p></li><li><span class="flow-num">03</span><strong>AI assistant</strong><p>Introduces itself as the office’s virtual assistant; answers or calls back.</p></li><li><span class="flow-num">04</span><strong>Secure layer</strong><p>Records the intake, outcome and next action.</p></li><li><span class="flow-num">05</span><strong>Clinic staff</strong><p>Receive a transfer, task or secure report link.</p></li></ol><p class="emergency-note"><strong>Emergency route:</strong> calls needing the existing answering service are transferred there using the clinic-approved script. The AI gives no medical advice.</p></section>
            <section id="timeline" class="section timeline-section wrap" aria-labelledby="timeline-title">${head("05",'<span id="timeline-title">From access to an accepted launch.</span>',`A plan over ${Math.max(...Array.from(model.values()).map(v=>v.weeks))} weeks, with earlier launch points for the first two versions.`)}<p class="timeline-note"><strong>Weeks run from kickoff.</strong> ${escape(PROPOSAL.timingPolicy)}</p><ol class="weeks">${PROPOSAL.weeks.map(w=>`<li><span class="week-label">Week ${w.number}</span><h3>${escape(w.title)}</h3><p>${escape(w.detail)}</p>${Array.from(model.values()).filter(v=>v.weeks===w.number).map(v=>`<span class="week-milestone">V${v.number} target go-live</span>`).join("")}</li>`).join("")}</ol><div class="schedule-bars" aria-label="Version delivery ranges">${Array.from(model.values()).map(v=>`<div class="schedule-bar" style="--weeks:${v.weeks};--print-width:${100*v.weeks/Math.max(...Array.from(model.values()).map(p=>p.weeks))}%"><span>V${v.number} · ${escape(v.name)}</span><span>Weeks 1–${v.weeks}</span></div>`).join("")}</div></section>
            <section id="running-costs" class="section costs-section wrap" aria-labelledby="cost-title">${head("06",'<span id="cost-title">What the monthly estimate is built on.</span>',"The activity split below is a planning assumption, not a measured call breakdown.")}<div class="cost-layout"><div><p class="cost-label">Core voice usage</p><table class="cost-table"><caption class="sr-only">Monthly modeled voice usage and cost</caption><tbody role="rowgroup"><tr role="row"><th role="rowheader" scope="row">Surgery intake<small>${count(a.surgeryCalls)} calls × ${a.surgeryMinutesPerCall} minutes</small></th><td role="cell">${count(voice.surgery)} min</td></tr><tr role="row"><th role="rowheader" scope="row">Hang-up callbacks<small>${count(a.missedCalls)} hang-ups; modeled callback talk time</small></th><td role="cell">${count(voice.callbacks)} min</td></tr><tr role="row"><th role="rowheader" scope="row">After-hours intake<small>${count(a.afterHoursCalls)} calls × ${a.afterHoursMinutesPerCall} minutes</small></th><td role="cell">${count(voice.afterhours)} min</td></tr><tr class="cost-total"><th role="rowheader" scope="row">Total modeled voice<small>${count(voiceMinutes)} minutes × ~${dollars(r.voiceMinute,2)} / minute</small></th><td role="cell">~${dollars(voiceCost,2)}</td></tr><tr role="row"><th role="rowheader" scope="row">Phone numbers<small>${a.phoneNumbers} numbers × ${dollars(r.phoneNumberMonthly)} / month</small></th><td role="cell">${dollars(a.phoneNumbers*r.phoneNumberMonthly)} / mo</td></tr><tr role="row"><th role="rowheader" scope="row">V3 win-back allowance<small>${count(a.winbackMinutes)} extra connected minutes assumed</small></th><td role="cell">~${dollars(a.winbackMinutes*r.voiceMinute)} voice</td></tr></tbody></table></div><div class="cost-context"><h3>Other usage and allowances</h3><p><strong>Eligibility:</strong> ${count(a.eligibilityChecks)} checks from ${count(a.appointments)} assumed appointments. The first ${count(r.eligibilityFirst.count)} at ${dollars(r.eligibilityFirst.rate,2)}, then ${dollars(r.eligibilityNext,2)} each, gives <strong>${dollars(eligibilityCost,2)}</strong>. The item budget allows modest recheck headroom.</p><p><strong>Infrastructure and messages:</strong> the foundation allowance covers AWS hosting, backups, light Bedrock summaries and SES notifications. Phone budgets include number allocation, confirmation texts and modest headroom. Reminder texts are provisional pending actual segments and carrier fees.</p><p class="plain-note">The ${dollars(r.voiceMinute,2)} / minute rate is a working estimate for the chosen voice stack. Final bills depend on model, voice, call duration, transfer / telephony charges and message volume. Sender registration, vendor minimums, partner / API fees and any BAA-related commercial requirements are not included in these ranges.</p></div></div></section>
            <section id="terms" class="section terms-section wrap" aria-labelledby="terms-title">${head("07",'<span id="terms-title">Working assumptions & terms.</span>',"")}<div class="terms-grid"><div class="term"><h3>Price & scope changes</h3><p>${escape(PROPOSAL.pricingPolicy)}</p></div><div class="term"><h3>Payment & acceptance</h3><p>${s.kickoffPercent}% at kickoff and ${s.acceptancePercent}% when the selected version is accepted as live against its scope checks. Pilot sign-off and the agreed test results establish acceptance.</p></div><div class="term"><h3>Consent & clinic approval</h3><p>AI callbacks go only to callers with call consent on file. The clinic confirms the source and permitted use of that consent, including before ModMed is connected. Recall and win-back activity require the clinic’s confirmation of appropriate consent and suppression rules.</p></div><div class="term"><h3>Support & monitoring</h3><p>The included support period starts when the selected version is accepted as live. It covers fixes and agreed workflow support; new features are additional scope. Monitoring is automated around the clock, with alerts to named owners. It does not include continuous human support.</p></div><div class="term"><h3>Clinic responsibilities</h3><p>Provide the access listed for each item, vendor agreements, approved scripts / emergency instructions, consent records and staff reviewers. Confirm operating hours, report recipients, retention rules and booking permissions during onboarding.</p></div><div class="term"><h3>Ownership & handover</h3><p>The clinic retains its accounts and data. Workflow configuration, operating notes and the staff handover are included. Third-party software and licenses remain governed by their vendor agreements.</p></div><div class="term wide-term"><h3>Outside this build fee</h3><p>Vendor subscriptions and usage, partner-program or API charges, messaging registration, taxes, clinic IT time and legal review. Changes to vendor access, unsupported integration routes and work beyond the accepted scope require agreement before implementation.</p></div></div></section>
            <section id="next-steps" class="next-section wrap" aria-labelledby="next-title"><div class="next-layout"><div><p class="eyebrow">Next step</p><h2 id="next-title">Choose the scope.<br>Set up the connections.</h2><p class="next-intro">The project starts with a defined version and a shared understanding of the access it needs.</p></div><ol class="next-steps"><li><span class="step">01</span><div><strong>Review a version</strong><p>Confirm the package and any agreed changes in writing.</p></div></li><li><span class="step">02</span><div><strong>Confirm the integration route</strong><p>The clinic or its IT company arranges vendor access, agreements and routing.</p></div></li><li><span class="step">03</span><div><strong>Schedule kickoff</strong><p>Agree the pilot tests, staff reviewers and launch milestones.</p></div></li></ol></div><div class="acceptance" id="acceptance"><div class="version-field"><label for="version-choice">Version for review</label><select id="version-choice"><option value="">Choose a version</option>${Array.from(model.values()).map(v=>`<option value="${v.id}">Version ${v.number} · ${escape(v.name)} · ${dollars(v.price)}</option>`).join("")}</select></div><div><span class="signature-label">Authorized name / company</span><div class="signature-line" aria-hidden="true"></div></div><div><span class="signature-label">Signature / date</span><div class="signature-line" aria-hidden="true"></div></div><p class="acceptance-note"><output id="selection-note" aria-live="polite">No version selected.</output> To accept, return the chosen version and signed details to the proposal author. Selecting here does not submit or sign an agreement.</p></div></section>
          </main><footer class="site-footer wrap"><div class="identity"><span class="monogram" aria-hidden="true">${escape(m.monogram)}</span>${escape(m.author)}</div><p>${escape(m.number)}<br>Valid until ${date(m.validUntil)}</p></footer>`;
        document.documentElement.dataset.quoteValidated="true";
      }
      function setTheme(theme,persist=false) {
        document.documentElement.dataset.theme=theme;
        const dark=theme==="dark";
        const button=$("#theme-toggle");
        button.innerHTML=icon(dark?"sun":"moon");
        button.setAttribute("aria-label",`Switch to ${dark?"light":"dark"} mode`);
        button.setAttribute("aria-pressed",String(dark));
        if(persist) try{localStorage.setItem("clinic-proposal-theme",theme);}catch{}
      }
      function selectVersion(value) {
        const v=model.get(value);
        $("#version-choice").value=v?v.id:"";
        $("#selection-note").textContent=v?`Version ${v.number} selected for review. `:"No version selected. ";
      }
      try {
        validateAndBuild();
        let theme=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
        try{const saved=localStorage.getItem("clinic-proposal-theme");if(["light","dark"].includes(saved))theme=saved;}catch{}
        document.documentElement.dataset.theme=theme;
        render();setTheme(theme);
        $("#theme-toggle").addEventListener("click",()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark",true));
        $("#print-button").addEventListener("click",async()=>{if(document.fonts)await document.fonts.ready;window.print();});
        $("#version-choice").addEventListener("change",e=>selectVersion(e.target.value));
        document.querySelectorAll("[data-select-version]").forEach(link=>link.addEventListener("click",()=>{selectVersion(link.dataset.selectVersion);}));
      } catch(error) {
        console.error(error);
        $("#app").innerHTML='<div class="error" role="alert"><h1>The quote needs a data check.</h1><p>A price or scope entry could not be validated. Please check the PROPOSAL object before sharing this page.</p></div>';
      }
    })();
  </script>
