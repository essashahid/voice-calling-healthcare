<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Proposal for phone coverage and patient follow-up workflows at an ophthalmology clinic: scope, three versions, build prices, delivery targets and estimated vendor costs.">
  <meta name="robots" content="noindex, nofollow">
  <title>Clinic Phone Proposal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <style>
    /* Layout: one 1120px document column; section headings and body share the left edge; tables and rules carry structure, cards only for the three versions. */
    :root{
      color-scheme:light;
      --bg:#f6f7f8;--surface:#ffffff;--ink:#17212b;--muted:#4c5966;--line:#dce1e6;--line-strong:#b3bdc7;
      --accent:#1c5871;--accent-tint:#ecf3f6;--accent-line:#86aabb;--on-accent:#ffffff;
      --serif:"Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
      --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
      --max:1120px;--gutter:32px;
    }
    @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101519;--surface:#161d23;--ink:#e3e8ec;--muted:#a2aeb9;--line:#28323b;--line-strong:#46525d;--accent:#88bfd6;--accent-tint:#14252e;--accent-line:#3f6d81;--on-accent:#0d1a20}}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#101519;--surface:#161d23;--ink:#e3e8ec;--muted:#a2aeb9;--line:#28323b;--line-strong:#46525d;--accent:#88bfd6;--accent-tint:#14252e;--accent-line:#3f6d81;--on-accent:#0d1a20}

    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:24px;-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
    h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
    ul,ol{padding:0;list-style:none}
    button,select{font:inherit;color:inherit}
    a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
    a:hover{text-decoration-thickness:2px}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .skip{position:absolute;left:16px;top:-60px;background:var(--ink);color:var(--bg);padding:8px 14px;z-index:5}
    .skip:focus{top:12px}
    .wrap{max-width:calc(var(--max) + 2*var(--gutter));margin-inline:auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
    .muted{color:var(--muted)}
    .label{display:block;font-size:13px;line-height:1.4;color:var(--muted)}
    .ino{display:inline-block;min-width:2.1em;color:var(--muted);font-weight:500}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table{border-collapse:collapse;width:100%}
    th{text-align:left;font-weight:600}

    /* Header */
    .site-header{border-bottom:1px solid var(--line)}
    .header-inner{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding-block:16px}
    .identity{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none}
    .monogram{width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--ink);font:600 13px/1 var(--serif);letter-spacing:.03em}
    .header-right{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap}
    .doc-meta{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:13px;color:var(--muted)}
    .doc-meta b{font-weight:500;color:var(--ink)}
    .controls{display:flex;gap:8px}
    .ctl{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font-size:13px;cursor:pointer}
    .ctl:hover{border-color:var(--ink)}
    .ctl svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

    /* Opening */
    .opening{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:56px;padding-block:56px 56px}
    .kicker{font-size:15px;font-weight:500;color:var(--accent)}
    h1{font:600 clamp(32px,3.6vw,44px)/1.14 var(--serif);letter-spacing:-.012em;margin:10px 0 20px;text-wrap:balance;max-width:22ch}
    .lede{font-size:18px;line-height:1.6;max-width:62ch}
    .lede+.lede{margin-top:14px}
    .contents{margin-top:32px;padding-top:20px;border-top:1px solid var(--line)}
    .contents ol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 32px;margin-top:10px;counter-reset:toc;font-size:15px}
    .contents li{counter-increment:toc;display:flex;gap:10px}
    .contents li::before{content:counter(toc);min-width:1.2em;color:var(--muted)}
    .brief{align-self:start;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px}
    .brief h2{font:600 15px/1.4 var(--sans)}
    .brief .src{font-size:13px;color:var(--muted);margin-top:2px}
    .brief dl{margin-top:16px}
    .brief dl>div{padding-block:12px;border-top:1px solid var(--line)}
    .brief dt{font-size:13px;color:var(--muted)}
    .brief dd{font-size:16px;margin-top:2px}
    .brief dd strong{font:600 22px/1.25 var(--sans);letter-spacing:-.01em}

    /* Sections */
    .section{border-top:1px solid var(--line);padding-block:64px}
    .section-head{margin-bottom:32px;max-width:72ch}
    h2.sh{font:600 clamp(25px,2.4vw,31px)/1.2 var(--serif);letter-spacing:-.008em;text-wrap:balance}
    .sec-no{font:500 .62em/1 var(--sans);color:var(--accent);margin-right:12px;vertical-align:.18em}
    .section-lede{margin-top:12px;font-size:17px;color:var(--muted)}
    h3.sub{font:600 18px/1.35 var(--sans);margin-bottom:14px}
    .block{margin-top:48px}
    .note{font-size:14px;color:var(--muted);max-width:80ch}
    .note strong{color:var(--ink);font-weight:600}

    /* Requested work */
    .req{border-top:1px solid var(--ink)}
    .req th,.req td{padding:16px 16px 16px 0;vertical-align:top;border-bottom:1px solid var(--line)}
    .req thead th{font-size:13px;font-weight:500;color:var(--muted);padding-block:12px}
    .req .n{width:44px;color:var(--muted);font-weight:500}
    .req .ask{width:30%;font-weight:600}
    .req .ver{width:120px;padding-right:0;font-size:14px;color:var(--muted);white-space:nowrap}

    /* Versions */
    .plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(6,auto);gap:0 20px}
    .plan{grid-row:span 6;display:grid;grid-template-rows:subgrid;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px;min-width:0}
    .plan.rec{border:2px solid var(--accent);padding:23px}
    .plan>*+*{border-top:1px solid var(--line);margin-top:18px;padding-top:18px}
    .plan-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:14px;color:var(--muted)}
    .plan-top .rec-label{color:var(--accent);font-weight:600}
    .plan h3{font:600 26px/1.2 var(--serif);margin-top:6px}
    .plan .descriptor{margin-top:6px;font-size:15px;color:var(--muted)}
    .plan .suits p{font-size:15px}
    .price{font:600 38px/1.1 var(--sans);letter-spacing:-.02em;margin-top:4px}
    .price-sub{font-size:13px;color:var(--muted);margin-top:8px}
    .figure{font:600 19px/1.3 var(--sans);margin-top:2px}
    .figure small{font-size:14px;font-weight:400;color:var(--muted)}
    .monthly .figure{font-weight:500}
    .scope-list li{display:flex;font-size:15px;line-height:1.45;padding-block:4px}
    .scope-list li small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
    .scope-list .base{font-weight:500}
    .scope-list+.label{margin-top:14px}
    .scope-list.out li{color:var(--muted)}
    .plans-foot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px 48px;margin-top:20px}
    .shared{margin-top:48px;display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px 48px;padding-top:28px;border-top:1px solid var(--line)}
    .shared h3{font:600 18px/1.35 var(--sans)}
    .shared h3+p{font-size:14px;color:var(--muted);margin-top:6px}
    .shared dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 40px}
    .shared dt{font-weight:600;font-size:15px}
    .shared dd{font-size:15px;color:var(--muted);margin-top:2px}

    /* Detailed scope */
    .scope-key{display:flex;flex-wrap:wrap;gap:6px 28px;font-size:14px;color:var(--muted);margin-bottom:16px}
    .scope{border-top:1px solid var(--ink);font-size:14.5px;line-height:1.5}
    .scope col.c-item{width:17%}.scope col.c-del{width:auto}.scope col.c-price{width:9%}.scope col.c-target{width:12%}.scope col.c-month{width:11%}.scope col.c-v{width:4.6%}
    .scope thead th{font-size:13px;font-weight:500;color:var(--muted);padding:12px 12px 12px 0;vertical-align:bottom;border-bottom:1px solid var(--line-strong)}
    .scope thead th.v,.scope td.v{text-align:center;padding-right:0}
    .scope .grp th{font:600 14px/1.4 var(--sans);color:var(--accent);padding:28px 0 10px;border-bottom:1px solid var(--line-strong)}
    .scope .main>*{padding:16px 12px 8px 0;vertical-align:top}
    .scope .main th{font-weight:600;padding-bottom:16px;border-bottom:1px solid var(--line)}
    .scope .main th .ino{display:block;margin-bottom:2px}
    .scope .detail td{padding:6px 12px 18px 0;border-bottom:1px solid var(--line)}
    .scope .money{font-weight:600;white-space:nowrap}
    .scope .sub{display:block;font-size:13px;color:var(--muted);margin-top:2px}
    .scope .row-note{display:block;font-size:13.5px;color:var(--muted);margin-top:6px;font-style:italic}
    .detail-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 32px;font-size:14px;color:var(--muted)}
    .detail-grid .label{font-weight:500;color:var(--ink);font-size:13px}
    .yes{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);vertical-align:middle}
    .no{color:var(--muted)}
    .records{display:none}
    .rec-group{font:600 15px/1.4 var(--sans);color:var(--accent);padding:24px 0 8px;border-bottom:1px solid var(--line-strong)}
    .record{padding:18px 0;border-bottom:1px solid var(--line)}
    .record h4{font:600 17px/1.35 var(--sans)}
    .record h4 .ino{min-width:2.3em}
    .record>p{margin-top:8px;font-size:15px}
    .record .row-note{display:block;font-size:14px;color:var(--muted);font-style:italic;margin-top:6px}
    .record dl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 20px;margin-top:14px}
    .record dl .full{grid-column:1/-1}
    .record dt{font-size:13px;color:var(--muted)}
    .record dd{font-size:15px}
    .gates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 48px;margin-top:28px}
    .gates p{font-size:15px;color:var(--muted)}
    .gates strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}

    /* Technical */
    .stack{border-top:1px solid var(--ink);font-size:15px}
    .stack thead th{font-size:13px;font-weight:500;color:var(--muted);padding:12px 16px 12px 0;border-bottom:1px solid var(--line-strong)}
    .stack td,.stack tbody th{padding:14px 16px 14px 0;vertical-align:top;border-bottom:1px solid var(--line)}
    .stack tbody th{width:19%}
    .stack td:nth-child(2){width:33%}
    .stack td:nth-child(3){width:20%;font-weight:500}
    .stack td:nth-child(4){color:var(--muted);font-size:14px}
    .stack-notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 40px;margin-top:24px}
    .stack-notes p{font-size:14.5px;color:var(--muted)}
    .stack-notes strong{display:block;color:var(--ink);font-weight:600;margin-bottom:4px}
    .flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;counter-reset:flow}
    .flow li{position:relative;padding:14px 28px 0 0;border-top:2px solid var(--line-strong);counter-increment:flow}
    .flow li:not(:last-child)::after{content:"";position:absolute;top:-6px;right:12px;width:10px;height:10px;border-top:2px solid var(--line-strong);border-right:2px solid var(--line-strong);transform:rotate(45deg)}
    .flow li.ai{border-top-color:var(--accent)}
    .flow strong{display:block;font-size:15px}
    .flow strong::before{content:counter(flow) ". ";color:var(--muted);font-weight:500}
    .flow p{font-size:14px;color:var(--muted);margin-top:4px}
    .callout{margin-top:24px;padding:14px 18px;border-left:3px solid var(--accent);background:var(--surface);font-size:15px;max-width:80ch}

    /* Delivery */
    .gantt{display:grid;grid-template-columns:150px repeat(8,minmax(0,1fr));align-items:center;row-gap:8px;font-size:13px}
    .gantt .wk{color:var(--muted);text-align:left;padding:0 0 6px 6px;border-left:1px solid var(--line)}
    .gantt .vn{grid-column:1;font-size:14px;font-weight:500;padding-right:12px}
    .gantt .bar{height:26px;background:var(--accent-tint);border:1px solid var(--accent-line);border-radius:4px;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap;grid-column-start:2}
    .weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 32px;margin-top:36px}
    .weeks li{border-top:1px solid var(--line-strong);padding-top:12px}
    .weeks .wl{font-size:13px;color:var(--muted)}
    .weeks h4{font:600 15px/1.4 var(--sans);margin-top:2px}
    .weeks p{font-size:14px;color:var(--muted);margin-top:4px}
    .weeks .ms{display:block;font-size:14px;font-weight:600;color:var(--accent);margin-top:8px}
    .deps{border-top:1px solid var(--ink);font-size:15px}
    .deps thead th{font-size:13px;font-weight:500;color:var(--muted);padding:12px 16px 12px 0;border-bottom:1px solid var(--line-strong)}
    .deps td,.deps tbody th{padding:13px 16px 13px 0;vertical-align:top;border-bottom:1px solid var(--line)}
    .deps tbody th{font-weight:500;width:38%}
    .deps td:nth-child(2){width:24%;color:var(--muted)}

    /* Costs */
    .costs{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:48px}
    .num-table{font-size:15px;border-top:1px solid var(--ink)}
    .num-table thead th{font-size:13px;font-weight:500;color:var(--muted);padding:12px 0 12px 12px;border-bottom:1px solid var(--line-strong);text-align:right;white-space:nowrap}
    .num-table thead th:first-child{text-align:left;padding-left:0}
    .num-table td,.num-table tbody th,.num-table tfoot th{padding:11px 0 11px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;white-space:nowrap}
    .num-table tbody th,.num-table tfoot th{text-align:left;padding-left:0;font-weight:500;white-space:normal}
    .num-table th small{display:block;font-size:13px;color:var(--muted);font-weight:400}
    .num-table .no{color:var(--muted)}
    .num-table tfoot th,.num-table tfoot td{font-weight:600;border-top:1px solid var(--ink);border-bottom:0}
    .basis p{font-size:15px;color:var(--muted)}
    .basis p+p{margin-top:12px}
    .basis strong{color:var(--ink);font-weight:600}

    /* Terms */
    .terms{display:grid;grid-template-columns:240px minmax(0,1fr);border-top:1px solid var(--ink)}
    .terms dt,.terms dd{padding-block:16px;border-bottom:1px solid var(--line)}
    .terms dt{font-weight:600;padding-right:24px}
    .terms dd{color:var(--muted)}

    /* Next steps */
    .steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 32px;counter-reset:step}
    .steps li{border-top:2px solid var(--accent);padding-top:12px;counter-increment:step}
    .steps strong{display:block;font-size:16px}
    .steps strong::before{content:counter(step) ". ";color:var(--muted);font-weight:500}
    .steps p{font-size:15px;color:var(--muted);margin-top:4px}
    .acceptance{margin-top:40px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:24px}
    .acceptance h3{font:600 18px/1.35 var(--sans)}
    .acc-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:24px;margin-top:18px;align-items:end}
    .acc-grid label,.acc-grid .label{margin-bottom:8px}
    .acc-grid select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);font-size:15px}
    .sig{height:44px;border-bottom:1px solid var(--line-strong)}
    .acc-note{margin-top:16px;font-size:14px;color:var(--muted)}
    .acc-note output{color:var(--ink);font-weight:500}

    .site-footer{border-top:1px solid var(--line)}
    .footer-inner{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;padding-block:24px 40px;font-size:13px;color:var(--muted)}
    .footer-inner .identity{font-size:14px}
    .error{max-width:720px;margin:64px auto;padding:24px;border:1px solid var(--ink)}

    @media (max-width:1100px){
      .plan{padding:20px}.plan.rec{padding:19px}
      .price{font-size:34px}
      .stack-notes{grid-template-columns:1fr 1fr}
    }
    @media (max-width:960px){
      .scope-table-wrap{display:none}
      .records{display:block}
      .opening{grid-template-columns:1fr;gap:32px}
      .plans{grid-template-columns:1fr;grid-template-rows:none;gap:20px}
      .plan{grid-row:auto;grid-template-rows:none}
      .shared{grid-template-columns:1fr;gap:16px}
      .costs{grid-template-columns:1fr;gap:36px}
      .weeks{grid-template-columns:repeat(2,minmax(0,1fr))}
      .flow{grid-template-columns:1fr;gap:0}
      .flow li{border-top:0;border-left:2px solid var(--line-strong);padding:0 0 18px 18px}
      .flow li.ai{border-left-color:var(--accent)}
      .flow li:not(:last-child)::after{display:none}
    }
    @media (max-width:720px){
      :root{--gutter:16px}
      body{font-size:16px}
      .section{padding-block:44px}
      .opening{padding-block:36px 40px}
      .lede{font-size:17px}
      .contents ol{grid-template-columns:1fr}
      .doc-meta{width:100%;order:2}
      .header-right{width:100%;justify-content:space-between}
      .req thead{display:none}
      .req tr{display:grid;grid-template-columns:32px minmax(0,1fr);padding:14px 0;border-bottom:1px solid var(--line)}
      .req th,.req td{border:0;padding:0}
      .req .n{grid-row:span 3;width:auto}
      .req .ask,.req .ver{width:auto}
      .req td:nth-child(3){margin-top:6px}
      .req .ver{margin-top:6px;font-size:13px}
      .plans-foot,.gates,.stack-notes{grid-template-columns:1fr}
      .stack thead,.deps thead{display:none}
      .stack tr,.deps tr{display:block;padding:14px 0;border-bottom:1px solid var(--line)}
      .stack td,.stack tbody th,.deps td,.deps tbody th{display:block;width:auto!important;padding:0;border:0}
      .stack td+td,.deps td{margin-top:4px}
      .stack td[data-label]::before,.deps td[data-label]::before{content:attr(data-label) ": ";color:var(--muted);font-weight:400}
      .gantt{grid-template-columns:44px repeat(8,minmax(0,1fr))}
      .gantt .wk{padding-left:3px;font-size:12px}
      .gantt .bar{padding:0 6px;font-size:12px}
      .weeks{grid-template-columns:1fr;gap:16px}
      .terms{grid-template-columns:1fr}
      .terms dt{border-bottom:0;padding-bottom:2px}
      .terms dd{padding-top:0}
      .steps{grid-template-columns:1fr}
      .acc-grid{grid-template-columns:1fr}
      .record dl{grid-template-columns:1fr 1fr}
      .hide-sm{display:none}
    }
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

    @page{size:Letter;margin:13mm 13mm 14mm}
    @media print{
      :root,:root[data-theme="dark"],:root:not([data-theme="light"]){color-scheme:light;--bg:#fff;--surface:#fff;--ink:#111a22;--muted:#3f4b57;--line:#d3d9df;--line-strong:#9aa6b2;--accent:#1c5871;--accent-tint:#ecf3f6;--accent-line:#86aabb;--gutter:0px}

          assert(savings>=0,`${v.id}: package exceeds item value.`);
          assert(cents(v.price)+cents(savings)===valueCents,`${v.id}: savings do not reconcile.`);
          assert(v.weeks>0&&v.weeks<=PROPOSAL.weeks.length,`${v.id}: target must fall within the plan.`);
          model.set(v.id,{...v,ids,items:vItems,value,savings,monthly});
        });
        ["surgery","callbacks","afterhours"].forEach(id=>assert(cents(itemMap.get(id).monthly[1])>=cents(voice[id]*PROPOSAL.rates.voiceMinute),`${id}: modeled voice exceeds budget.`));
        assert(itemMap.get("insurance").monthly[0]>=eligibilityCost,"Eligibility allowance is below its modeled base cost.");
      }

      const versions = () => Array.from(model.values());
      const firstVersion = (id) => versions().find(v=>v.ids.includes(id));
      const isRequest = (i) => /^\d$/.test(i.number) && i.number!=="0";
      const sectionHead = (n,id,title,lede="") => `<div class="section-head"><h2 class="sh" id="${id}"><span class="sec-no">${n}</span>${title}</h2>${lede?`<p class="section-lede">${lede}</p>`:""}</div>`;
      const itemDelivers = (i) => {
        const s=PROPOSAL.settings;
        if(i.id==="afterhours") return `${i.delivers} The report arrives at ${s.morningReport}, ${s.clinicTimezone.toLowerCase()}.`;
        if(i.id==="dashboard") return `${i.delivers} Sent each ${s.weeklyReport}.`;
        if(i.id==="support") return `${s.firstSupportMonths} month of ${i.delivers}`;
        if(i.id==="support-extra") return `${s.extraSupportMonths} more months of support (${s.firstSupportMonths+s.extraSupportMonths} in total), ${i.delivers}`;
        return i.delivers;
      };
      const itemTarget = (i) => i.week?`Week ${i.week}`:"After go-live";
      const itemMonthly = (i) => i.monthly[1]?`${range(i.monthly)}<span class="sub">per month</span>`:escape(i.monthlyLabel||"None");
      const itemMonthlyText = (i) => i.monthly[1]?`${range(i.monthly)} per month`:(i.monthlyLabel||"None");

      function renderPlan(v) {
        const prior=v.base?model.get(v.base):null;
        const own=v.itemIds.map(id=>itemMap.get(id)).filter(i=>i.group!=="support");
        const inList=[
          prior?`<li class="base"><span class="ino"></span>Everything in Version ${prior.number}</li>`:"",
          ...own.map(i=>`<li><span class="ino">${escape(i.number)}</span><span>${escape(i.id==="support-extra"?`${PROPOSAL.settings.extraSupportMonths} more months of support (${PROPOSAL.settings.firstSupportMonths+PROPOSAL.settings.extraSupportMonths} in total)`:i.short)}${i.condition?`<small>${escape(i.condition)}</small>`:""}</span></li>`)
        ].join("");
        const missing=items.filter(i=>!v.ids.includes(i.id));
        const missingReq=missing.filter(isRequest);
        const missingExtras=missing.filter(i=>i.group==="extras");
        let outList=missingReq.map(i=>`<li><span class="ino">${escape(i.number)}</span><span>${escape(i.short)}</span></li>`).join("");
        if(missingExtras.length) outList+=`<li><span class="ino"></span><span>Version 3 additions (${escape(missingExtras[0].number)}–${escape(missingExtras[missingExtras.length-1].number)})</span></li>`;
        if(!outList) outList=`<li><span class="ino"></span><span>Nothing in the proposed scope</span></li>`;
        return `<article class="plan${v.recommended?" rec":""}" aria-labelledby="plan-${v.id}">
          <header><p class="plan-top"><span>Version ${v.number}</span>${v.recommended?'<span class="rec-label">Recommended</span>':""}</p><h3 id="plan-${v.id}">${escape(v.name)}</h3><p class="descriptor">${escape(v.descriptor)}</p></header>
          <div class="suits"><span class="label">Suits</span><p>${escape(v.suits)}</p></div>
          <div><span class="label">One-time build fee</span><p class="price">${dollars(v.price)}</p><p class="price-sub">Items priced separately: ${dollars(v.value)}. This version is ${dollars(v.savings)} less.</p></div>
          <div><span class="label">Target go-live</span><p class="figure">${v.weeks} weeks <small>from kickoff</small></p></div>
          <div class="monthly"><span class="label">Estimated vendor costs, paid monthly by the clinic</span><p class="figure">${range(v.monthly)} <small>per month</small></p></div>
          <div><span class="label">Includes</span><ul class="scope-list">${inList}</ul><span class="label">Not included</span><ul class="scope-list out">${outList}</ul></div>
        </article>`;
      }

      function renderScopeTable() {
        let last="", out="";
        items.forEach(i=>{
          if(i.group!==last){ out+=`<tbody><tr class="grp"><th colspan="8" scope="colgroup">${escape(PROPOSAL.groups[i.group])}</th></tr></tbody>`; last=i.group; }
          const cells=versions().map(v=>v.ids.includes(i.id)?`<td class="v"><span class="yes" aria-hidden="true"></span><span class="sr-only">Included in Version ${v.number}</span></td>`:`<td class="v"><span class="no" aria-hidden="true">–</span><span class="sr-only">Not in Version ${v.number}</span></td>`).join("");

        });
        return out;
      }
      function renderScopeRecords() {
        let last="", out="";
        items.forEach(i=>{
          if(i.group!==last){ out+=`<h3 class="rec-group">${escape(PROPOSAL.groups[i.group])}</h3>`; last=i.group; }

          out+=`<article class="record" data-item="${i.id}"><h4><span class="ino">${escape(i.number)}</span>${escape(i.name)}</h4><p>${escape(itemDelivers(i))}${i.note?`<span class="row-note">${escape(i.note)}</span>`:""}</p><dl><div><dt>Build price</dt><dd>${dollars(i.price)}${i.feeNote?` <span class="muted">(${escape(i.feeNote.toLowerCase())})</span>`:""}</dd></div><div><dt>Target</dt><dd>${itemTarget(i)}<br><span class="muted">${escape(i.deliveryNote)}</span></dd></div><div><dt>Monthly estimate</dt><dd>${escape(itemMonthlyText(i))}</dd></div><div><dt>Included in</dt><dd>${incText}</dd></div><div class="full"><dt>Clinic provides</dt><dd>${escape(i.access)}</dd></div><div class="full"><dt>Accepted when</dt><dd>${escape(i.done)}</dd></div></dl></article>`;

        return out;

        return `<table class="num-table"><caption class="sr-only">Estimated monthly vendor costs by item and version, in US dollars</caption><thead><tr><th scope="col">Item</th>${vs.map(v=>`<th scope="col">Version ${v.number}</th>`).join("")}</tr></thead><tbody>${rows}${other}</tbody><tfoot><tr><th scope="row">Monthly estimate</th>${vs.map(v=>`<td data-version="${v.id}">${range(v.monthly)}</td>`).join("")}</tr></tfoot></table>`;
      }

      <li><strong>Arrange access</strong><p>The clinic or its IT company arranges vendor access, agreements and call routing.</p></li>
      <li><strong>Schedule kickoff</strong><p>Agree the pilot tests, staff reviewers and launch milestones. The first ${s.kickoffPercent}% is due at kickoff.</p></li>
    </ol>
    <div class="acceptance" id="acceptance">
      <h3>Acceptance record</h3>
      <div class="acc-grid">
        <div><label class="label" for="version-choice">Version</label><select id="version-choice"><option value="">Choose a version</option>${vs.map(v=>`<option value="${v.id}">Version ${v.number}, ${escape(v.name)}: ${dollars(v.price)}</option>`).join("")}</select></div>
        <div><span class="label">Authorized name and company</span><div class="sig" aria-hidden="true"></div></div>
        <div><span class="label">Signature and date</span><div class="sig" aria-hidden="true"></div></div>
      </div>
      <p class="acc-note"><output id="selection-note" aria-live="polite">No version selected.</output> This page does not submit or sign anything. To accept, send the chosen version and signed details to ${escape(m.author)}.</p>
    </div>
  </div></section>
</main>
<footer class="site-footer"><div class="wrap footer-inner"><span class="identity"><span class="monogram" aria-hidden="true">${escape(m.monogram)}</span>${escape(m.author)}</span><span>Proposal ${escape(m.number)} · Valid until ${date(m.validUntil)}</span></div></footer>`;
        root.dataset.quoteValidated="true";
      }

      const THEME_KEY="clinic-proposal-theme";
      const systemDark=matchMedia("(prefers-color-scheme: dark)");
      const effectiveTheme=()=>root.dataset.theme||(systemDark.matches?"dark":"light");
      function syncThemeButton() {
        const dark=effectiveTheme()==="dark";
        const button=$("#theme-toggle");
        if(!button) return;
        button.innerHTML=`${icons[dark?"sun":"moon"]}<span>${dark?"Light":"Dark"}</span>`;
        button.setAttribute("aria-label",`Switch to ${dark?"light":"dark"} theme`);
      }
      function selectVersion(value) {
        const v=model.get(value);
        $("#version-choice").value=v?v.id:"";
        $("#selection-note").textContent=v?`Version ${v.number} selected.`:"No version selected.";
      }
      try {
        validateAndBuild();
        try{const saved=localStorage.getItem(THEME_KEY);if(saved==="light"||saved==="dark")root.dataset.theme=saved;}catch{}
        render();
        syncThemeButton();
        systemDark.addEventListener("change",syncThemeButton);
        $("#theme-toggle").addEventListener("click",()=>{const next=effectiveTheme()==="dark"?"light":"dark";root.dataset.theme=next;try{localStorage.setItem(THEME_KEY,next);}catch{}syncThemeButton();});
        $("#print-button").addEventListener("click",async()=>{if(document.fonts)await document.fonts.ready;window.print();});
        $("#version-choice").addEventListener("change",e=>selectVersion(e.target.value));
      } catch(error) {
        console.error(error);
        $("#app").innerHTML='<div class="error" role="alert"><h1>The quote needs a data check.</h1><p>A price or scope entry could not be validated. Check the PROPOSAL object before sharing this page.</p></div>';
      }
    })();
  </script>
</body>
</html>
