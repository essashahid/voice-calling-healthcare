<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Proposal for a real estate brokerage website: two listings options with fixed prices, detailed scope, a delivery plan for December 12, running costs and terms.">
  <meta name="robots" content="noindex, nofollow">
  <title>Brokerage Website Proposal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
  <style>
    /* Same system as the clinic proposal: one shared 1520px grid, serif for section titles and prices, Plex Sans for everything read or compared.
       One bordered comparison panel for the two options; everything else is rules, tables and open space. */
    :root{
      color-scheme:light;
      --bg:#f6f7f8;--surface:#ffffff;--ink:#16202a;--muted:#4b5865;--line:#dde2e7;--line-strong:#aab5c0;
      --accent:#1c5871;--accent-tint:#edf4f7;--accent-line:#8db0c0;
      --serif:"Source Serif 4","Source Serif Pro",Georgia,"Times New Roman",serif;
      --sans:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
      --max:1520px;--gutter:clamp(32px,3.2vw,48px);
    }
    @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#101519;--surface:#161d23;--ink:#e4e9ed;--muted:#a3afba;--line:#27313a;--line-strong:#4a5661;--accent:#89c0d7;--accent-tint:#15262f;--accent-line:#3f6d81}}
    :root[data-theme="dark"]{color-scheme:dark;--bg:#101519;--surface:#161d23;--ink:#e4e9ed;--muted:#a3afba;--line:#27313a;--line-strong:#4a5661;--accent:#89c0d7;--accent-tint:#15262f;--accent-line:#3f6d81}

    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth;scroll-padding-top:20px;-webkit-text-size-adjust:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
    h1,h2,h3,h4,p,ul,ol,dl,dd{margin:0}
    ul,ol{padding:0;list-style:none}
    button,select{font:inherit;color:inherit}
    a{color:var(--accent);text-underline-offset:3px;text-decoration-thickness:1px}
    a:hover{text-decoration-thickness:2px}
    :focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .skip{position:absolute;left:16px;top:-60px;background:var(--ink);color:var(--bg);padding:8px 14px;z-index:5}
    .skip:focus{top:12px}
    .wrap{max-width:calc(var(--max) + 2*var(--gutter));margin-inline:auto;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
    .lbl{display:block;font-size:13px;line-height:1.4;color:var(--muted)}
    .no{color:var(--muted)}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent)}
    .table-wrap{overflow-x:auto}
    table{border-collapse:collapse;width:100%}
    th{text-align:left;font-weight:600}

    /* Header */
    .site-header{border-bottom:1px solid var(--line)}
    .header-inner{display:flex;align-items:center;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;padding-block:16px}
    .identity{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none}
    .avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
    .footer-inner .avatar{width:28px;height:28px}
    .header-right{display:flex;align-items:center;gap:10px 24px;flex-wrap:wrap}
    .doc-meta{display:flex;flex-wrap:wrap;gap:2px 20px;font-size:13px;color:var(--muted)}
    .doc-meta b{font-weight:500;color:var(--ink)}
    .controls{display:flex;gap:8px}
    .ctl{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font-size:13px;cursor:pointer}
    .ctl:hover{border-color:var(--ink)}
    .ctl svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

    /* Overview */
    .overview{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px 64px;padding-block:56px 48px;align-items:end}
    .kicker{font-size:15px;font-weight:500;color:var(--accent)}
    h1{font:600 clamp(34px,4vw,48px)/1.08 var(--serif);letter-spacing:-.015em;margin-top:10px;text-wrap:balance}
    .facts{display:grid;gap:10px;font-size:18px;line-height:1.5;max-width:68ch}
    .facts li{position:relative;padding-left:20px}
    .facts li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
    .toc{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 28px;padding-top:20px;border-top:1px solid var(--line);font-size:15px}
    .toc-h{font-weight:600;color:var(--ink)}
    .toc ul{display:flex;flex-wrap:wrap;gap:6px 28px}

    /* Sections */
    .section{padding-block:56px}
    .section+.section{border-top:1px solid var(--line)}
    .sec-head{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:12px 64px;align-items:baseline;margin-bottom:32px}
    h2{font:600 clamp(26px,2.6vw,32px)/1.15 var(--serif);letter-spacing:-.01em;text-wrap:balance}
    .sec-head p{font-size:16px;color:var(--muted);max-width:64ch}
    .sec-head p+p{margin-top:8px}
    h3.sub{font:600 18px/1.35 var(--sans);margin-bottom:6px}
    .sub-lede{font-size:15px;color:var(--muted);margin-bottom:16px;max-width:72ch}
    .part+.part{margin-top:48px;padding-top:32px;border-top:1px solid var(--line)}

    /* Options comparison */
    .cmp{display:grid;grid-template-columns:200px repeat(2,minmax(0,1fr));grid-template-rows:repeat(7,auto);background:var(--surface);border:1px solid var(--line-strong);border-radius:10px 10px 0 0;overflow:hidden}
    .cmp-labels,.opt{grid-row:1/span 7;display:grid;grid-template-rows:subgrid;min-width:0}
    .cmp-labels{background:var(--bg)}
    .cmp-labels>*,.opt>*{padding:16px 22px;border-top:1px solid var(--line)}
    .cmp-labels>:first-child,.opt>:first-child{border-top:0}
    .cmp-labels>*{font-size:14px;font-weight:500;color:var(--muted)}
    .opt{border-left:1px solid var(--line)}
    .opt.rec{background:var(--accent-tint);box-shadow:inset 0 3px 0 var(--accent)}
    .opt-head{padding-top:22px!important}
    .opt-top{display:flex;justify-content:space-between;gap:8px;font-size:14px;color:var(--muted)}
    .opt-top .rec-label{color:var(--accent);font-weight:600}
    .opt h3{font:600 24px/1.2 var(--serif);margin-top:4px}
    .opt .desc{font-size:15px;color:var(--muted);margin-top:4px}
    .price{font:600 40px/1.05 var(--serif);letter-spacing:-.01em}
    .price-sub{font-size:13px;color:var(--muted);margin-top:6px}
    .big{font:600 20px/1.3 var(--sans)}
    .big small{font-size:14px;font-weight:400;color:var(--muted);white-space:nowrap}
    .opt .txt{font-size:15px;line-height:1.5;max-width:62ch}
    .opt .txt.out{color:var(--muted)}
    .cell-lbl{display:none}
    .cmp-foot{display:grid;grid-template-columns:200px minmax(0,1fr);border:1px solid var(--line-strong);border-top:0;border-radius:0 0 10px 10px;background:var(--bg)}
    .cmp-foot>*{padding:14px 22px}
    .cmp-foot h3{font:500 14px/1.5 var(--sans);color:var(--muted)}
    .incl{display:flex;flex-wrap:wrap;gap:6px 28px;font-size:14.5px}
    .incl li{position:relative;padding-left:14px}
    .incl li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
    .cmp-notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 48px;margin-top:18px;font-size:14px;color:var(--muted)}
    .cmp-notes p{max-width:80ch}
    .cmp-notes strong{color:var(--ink);font-weight:600}

    /* Scope */
    .scope-tools{display:flex;justify-content:space-between;align-items:center;gap:12px 24px;flex-wrap:wrap;margin-bottom:12px;font-size:14px;color:var(--muted)}
    .scope-tools>span{max-width:88ch}
    .linkbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer}
    .linkbtn:hover{border-color:var(--ink)}
    .srow{display:grid;grid-template-columns:minmax(0,1fr) 92px 150px 128px 34px 34px 28px;align-items:center;column-gap:12px}
    .scope-tbl,.scope-tbl>*,.scope-tbl>*>tr,.scope-tbl>*>tr>td{display:block;padding:0}
    .scope-head{padding:10px 0;border-bottom:1px solid var(--ink);font-size:13px;font-weight:500;color:var(--muted)}
    .scope-head .c{text-align:center}
    .grp{font:600 15px/1.4 var(--sans);color:var(--accent);padding:26px 0 8px;border-bottom:1px solid var(--line-strong)}
    .it{border-bottom:1px solid var(--line)}
    .it>summary{list-style:none;cursor:pointer;padding:14px 0;font-size:15px}
    .it>summary::-webkit-details-marker{display:none}
    .it>summary:hover .nm>span:last-child{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}
    .it>summary:focus-visible{outline-offset:-2px}
    .nm{font-weight:600;display:flex;gap:10px;min-width:0}
    .no-tag{min-width:2.2em;color:var(--muted);font-weight:500}
    .money{font-weight:600}
    .s-sub{display:block;font-size:13px;color:var(--muted);line-height:1.35}
    .srow .c{text-align:center}
    .chev{width:14px;height:14px;justify-self:end;transition:transform .15s;stroke:var(--muted);fill:none;stroke-width:2}
    .it[open] .chev{transform:rotate(180deg)}
    .it-body{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:16px 32px;padding:4px 0 20px calc(2.2em + 10px);font-size:14.5px;line-height:1.55}
    .it-body .note{display:block;color:var(--muted);font-style:italic;margin-top:6px;font-size:14px}
    .it-body .lbl{font-weight:500;margin-bottom:3px}
    .m-meta{display:none}
    .gates p{max-width:72ch}
    .gates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 48px;margin-top:24px;font-size:14.5px;color:var(--muted)}
    .gates strong{color:var(--ink);font-weight:600}

    /* Delivery */
    .flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
    .flow li{position:relative;padding:12px 26px 0 0;border-top:2px solid var(--line-strong)}
    .flow li:not(:last-child)::after{content:"";position:absolute;top:-6px;right:12px;width:9px;height:9px;border-top:2px solid var(--line-strong);border-right:2px solid var(--line-strong);transform:rotate(45deg)}
    .flow li.ai{border-top-color:var(--accent)}
    .flow strong{display:block;font-size:15px}
    .flow p{font-size:14px;color:var(--muted);margin-top:2px}
    .emerg{margin-top:16px;font-size:14.5px;color:var(--muted);max-width:120ch}
    .emerg strong{color:var(--ink)}
    .tl{display:grid;grid-template-columns:110px repeat(4,minmax(0,1fr));row-gap:8px}
    .tl .wk{padding:0 10px 10px;border-left:1px solid var(--line);font-size:13.5px;line-height:1.4}
    .tl .wk b{display:block;font-size:13px;font-weight:500;color:var(--muted)}
    .tl .wk .t{display:block;font-weight:600}
    .tl .wk small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
    .tl .vn{grid-column:1;font-size:14px;font-weight:500;align-self:center}
    .tl .vs{display:none}
    .tl .bar{grid-column-start:2;height:28px;border-radius:4px;background:var(--accent-tint);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:flex-end;padding:0 10px;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden}
    .tl .bar.wait{background:transparent;border-style:dashed;border-color:var(--line-strong);justify-content:flex-start;font-weight:500;color:var(--muted)}
    .tl-note{margin-top:12px;font-size:14px;color:var(--muted);max-width:100ch}
    .weeklist{display:none;grid-template-columns:1fr 1fr;gap:10px 20px;margin-top:16px;font-size:14px}
    .weeklist b{display:block}
    .weeklist span{color:var(--muted)}
    .deps{font-size:14.5px;border-top:1px solid var(--ink)}
    .deps thead th{font-size:13px;font-weight:500;color:var(--muted);padding:10px 16px 10px 0;border-bottom:1px solid var(--line-strong)}
    .deps td,.deps tbody th{padding:11px 16px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
    .deps tbody th{font-weight:500;width:42%}
    .deps td:nth-child(2){width:18%;color:var(--muted)}
    .deps td:nth-child(3){width:14%;white-space:nowrap}

    /* Costs, compliance, terms */
    .costs{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:0 40px}
    .costs-head{grid-column:1/-1}
    .num{font-size:14.5px;border-top:1px solid var(--ink)}
    .num thead th{font-size:13px;font-weight:500;color:var(--muted);padding:10px 0 10px 12px;border-bottom:1px solid var(--line-strong);text-align:right;white-space:nowrap}
    .num thead th:first-child{text-align:left;padding-left:0}
    .num td,.num tbody th,.num tfoot th{padding:9px 0 9px 12px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;white-space:nowrap}
    .num tbody th,.num tfoot th{text-align:left;padding-left:0;font-weight:500;white-space:normal}
    .num th small{display:block;font-size:13px;color:var(--muted);font-weight:400}
    .num tfoot th,.num tfoot td{font-weight:600;border-top:1px solid var(--ink);border-bottom:0}
    .notes{font-size:14.5px;color:var(--muted);max-width:72ch}
    .notes li+li{margin-top:8px}
    .notes strong{color:var(--ink);font-weight:600}
    .vend{font-size:14.5px;border-top:1px solid var(--ink)}
    .vend thead th{font-size:13px;font-weight:500;color:var(--muted);padding:10px 16px 10px 0;border-bottom:1px solid var(--line-strong)}
    .vend td,.vend tbody th{padding:11px 16px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
    .vend tbody th{width:19%}
    .vend td:nth-child(2){width:34%}
    .vend .st{display:block;font-weight:600}
    .vend .dt{display:block;color:var(--muted);font-size:14px}
    .rules{columns:2;column-gap:48px;font-size:14.5px;color:var(--muted)}
    .rules li{max-width:72ch;break-inside:avoid;margin-bottom:14px}
    .rules strong{color:var(--ink);font-weight:600}
    .rules-foot{margin-top:16px;font-size:14px;color:var(--muted)}
    .terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 64px}
    .terms>div{padding:14px 0;border-top:1px solid var(--line)}
    .terms dt{font-weight:600;font-size:15px}
    .terms dd{font-size:14.5px;color:var(--muted);margin-top:2px;max-width:70ch}
    @media screen and (min-width:1360px){.cmp-notes{grid-template-columns:1fr}}

    /* Real estate work */
    .work{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:24px 64px;align-items:start}
    .shot{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);line-height:0}
    .shot img{display:block;width:100%;height:auto}
    .work h3{font:600 24px/1.2 var(--serif)}
    .work .site{font-size:15px;margin-top:4px}
    .work .lede{font-size:16px;margin-top:12px;max-width:64ch}
    .work ul{display:grid;gap:6px;margin-top:14px;font-size:15px;max-width:72ch}
    .work li{position:relative;padding-left:18px}
    .work li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
    .work .aside{font-size:14px;color:var(--muted);margin-top:14px;max-width:72ch}

    .site-footer{border-top:1px solid var(--line)}
    .footer-inner{display:flex;justify-content:space-between;align-items:center;gap:10px 24px;flex-wrap:wrap;padding-block:22px 36px;font-size:13px;color:var(--muted)}
    .footer-inner .identity{font-size:14px}
    .error{max-width:720px;margin:64px auto;padding:24px;border:1px solid var(--ink)}

    @media screen and (max-width:1100px){
      .cmp{grid-template-columns:160px repeat(2,minmax(0,1fr))}
      .cmp-labels>*,.opt>*{padding:14px 16px}
      .cmp-foot{grid-template-columns:160px minmax(0,1fr)}
      .cmp-foot>*{padding:14px 16px}
      .price{font-size:34px}
      .srow{grid-template-columns:minmax(0,1fr) 84px 130px 116px 30px 30px 24px;column-gap:10px}
    }
    @media screen and (max-width:900px){
      :root{--gutter:24px}
      .overview,.sec-head,.work{grid-template-columns:1fr}
      .overview{padding-block:40px 36px;gap:16px}
      .sec-head{margin-bottom:24px}
      .cmp{grid-template-columns:1fr;grid-template-rows:none;border:0;background:transparent;border-radius:0;overflow:visible;gap:14px}
      .cmp-labels{display:none}
      .opt{grid-row:auto;grid-template-rows:none;grid-template-columns:1fr 1fr;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
      .opt.rec{background:var(--accent-tint);border-color:var(--accent);box-shadow:none}
      .opt>*{padding:12px 16px}
      .opt-head,.opt .pr,.opt .inc,.opt .exc,.opt .fit{grid-column:1/-1}
      .opt .mo{border-left:1px solid var(--line)}
      .cell-lbl{display:block;font-size:13px;color:var(--muted);margin-bottom:2px}
      .cmp-foot{grid-template-columns:1fr;margin-top:14px;border-top:1px solid var(--line-strong);border-radius:10px}
      .cmp-foot>*+*{padding-top:0}
      .cmp-notes,.gates,.costs,.terms{grid-template-columns:1fr}
      .rules{columns:1}
      .costs{gap:28px}
      .scope-head{display:none}
      .it>summary.srow{grid-template-columns:minmax(0,1fr) 20px;row-gap:4px}
      .it>summary .d{display:none}
      .m-meta{display:block;grid-column:1;font-size:14px;color:var(--muted);padding-left:calc(2.2em + 10px)}
      .m-meta b{color:var(--ink);font-weight:600}
      .chev{grid-column:2;grid-row:1}
      .it-body{grid-template-columns:1fr;gap:12px}
      .flow{grid-template-columns:1fr}
      .flow li{border-top:0;border-left:2px solid var(--line-strong);padding:0 0 14px 16px}
      .flow li.ai{border-left-color:var(--accent)}
      .flow li:not(:last-child)::after{display:none}
      .tl{grid-template-columns:44px repeat(4,minmax(0,1fr))}
      .tl .wk{padding:0 4px 8px}
      .tl .wk b .w{display:none}
      .tl .wk .t,.tl .wk small{display:none}
      .tl .bar{padding:0 6px;font-size:12px}
      .tl .bar .w{display:none}
      .tl .vl{display:none}
      .tl .vs{display:inline}
      .weeklist{display:grid}
    }
    @media screen and (max-width:600px){
      :root{--gutter:16px}
      .doc-meta{order:2;width:100%}
      .header-right{width:100%;justify-content:space-between}
      .section{padding-block:40px}
      .facts{font-size:17px;gap:8px}
      .toc{display:block;font-size:16px}
      .toc-h{margin-bottom:10px}
      .toc ul{display:grid;gap:10px}
      .toc li{position:relative;padding-left:20px}
      .toc li::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
      .weeklist{grid-template-columns:1fr}
      .deps thead,.vend thead{display:none}
      .deps tr,.vend tr{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
      .deps td,.deps tbody th,.vend td,.vend tbody th{display:block;width:auto!important;padding:0;border:0;white-space:normal}
      .deps td,.vend td{margin-top:3px}
      .deps td[data-lbl]::before{content:attr(data-lbl) ": ";color:var(--muted)}
    }
    @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chev{transition:none}}

    @page{size:Letter;margin:12mm 13mm 13mm}
    @media print{
      :root,:root[data-theme="dark"],:root:not([data-theme="light"]){color-scheme:light;--bg:#ffffff;--surface:#ffffff;--ink:#111a22;--muted:#3e4a56;--line:#d5dbe1;--line-strong:#9ca8b4;--accent:#1c5871;--accent-tint:#eef4f7;--accent-line:#8db0c0;--gutter:0px}
      body{font-size:9.5pt;line-height:1.42;background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .skip,.controls,.toc,.chev,.linkbtn,.weeklist,.m-meta{display:none!important}

      items: [
        { id: "foundation", number: "0", group: "foundation", name: "Design, hosting and editing setup", price: 650, ready: [1,4], readyNote: "Home page design for approval", delivers: "A design system built from the brokerage’s brand (type, colors, buttons and cards) and a custom, mobile-first design for every page. The site runs on Next.js, hosted on Netlify with SSL and a global CDN. The team edits content in Sanity Studio, and published changes appear on the site within a minute. Includes a staging site for reviews and Google Analytics 4.", access: "Logo and brand files, photos, a few sites the broker likes, editor email addresses, and Netlify and Sanity accounts in the brokerage’s name (they can be created for transfer).", done: "The home page design is approved. Each editor can log in and publish a test change that appears within a minute. The home page scores 90 or more for mobile performance and accessibility in Lighthouse." },
        { id: "home", number: "1", group: "pages", name: "Home page", price: 400, ready: [3,1], delivers: "A clear headline and a “Book a call” button at the top, then featured listings, a team preview, recent testimonials, upcoming events and a short mission statement. Each section pulls from content the team manages, so the home page stays current on its own.", access: "Headline, key messages and a hero photo or short video.", done: "Every section shows live content, and the “Book a call” button opens the form on phone, tablet and desktop." },
        { id: "team", number: "2", group: "pages", name: "Meet the team", price: 250, ready: [3,0], delivers: "Profiles the team manages: photo, title, bio, phone, email, license number, languages and social links, in any order. Each profile has a “Contact” button that opens the form with that agent selected, so the CRM can route the lead.", access: "Headshots, bios, contact details and license numbers.", done: "An editor adds and reorders a profile without help, and a lead sent from a profile reaches the CRM tagged with that agent." },
        { id: "featured", number: "3A", group: "pages", name: "Featured listings", price: 450, ready: [3,2], delivers: "Listings the team adds in Sanity: status (coming soon, active, pending or sold), price, address, beds, baths, square feet, photos, description and a video or 3D-tour link. Includes a listings page with status and area filters, a page for each listing, a sold archive and an “Ask about this home” button that sends the listing with the lead. Photos are resized and compressed automatically.", access: "Current listings, with photos the brokerage owns or is licensed to use.", done: "An editor publishes a listing with photos and later marks it sold. An inquiry from that listing reaches the CRM with its address.", note: "Shows the brokerage’s own listings. Showing other brokers’ listings requires IDX (item 3B)." },
        { id: "idx", number: "3B", group: "pages", name: "IDX/MLS home search", price: 1000, ready: [3,3], readyNote: "Once the MLS approves", delivers: "An IDX provider (IDX Broker, or iHomefinder if it serves the MLS on better terms) connected to the broker’s MLS and styled to match the site: search with filters and a map, listing pages inside the site’s header and footer, saved searches, new-listing email alerts and sign-up prompts. The brokerage’s own listings can load from the MLS automatically. Sign-ups reach the CRM through the provider’s CRM connection or a Zapier link to the same webhook.", access: "The broker’s MLS and membership details, a signed MLS IDX agreement that authorizes the provider, and the IDX subscription in the brokerage’s name.", done: "Search shows current MLS listings with the attribution and disclaimers the MLS requires, and a test sign-up appears in the CRM marked as an IDX lead." },
        { id: "reviews", number: "4", group: "pages", name: "Testimonials, video and written", price: 300, ready: [3,0], delivers: "Written and video reviews the team adds: client name, photo, quote, buyer or seller, area, and an uploaded clip or a YouTube or Vimeo link. Videos load only when played, so pages stay fast. Selected reviews also appear on the home page.", access: "The first set of reviews, each with the client’s permission, plus video files or links.", done: "An editor adds a written review and a video review in a few minutes each, and the videos play on iPhone and Android." },
        { id: "mission", number: "5", group: "pages", name: "Mission and vision", price: 100, ready: [3,1], delivers: "A page for the brokerage’s mission, vision and values, with an optional message and photo from the broker. The team can edit the text in Sanity.", access: "Approved mission, vision and values text.", done: "The page matches the approved text, and an editor can change it without help." },
        { id: "events", number: "6", group: "pages", name: "Events", price: 300, ready: [3,2], delivers: "Events the team adds: title, date and time, place or online link, image, description and an RSVP button that opens the form with the event selected, or links to an outside RSVP page. Past events move to an archive automatically. Each event has an add-to-calendar link and is marked up so Google can show its date.", access: "Upcoming events, plus any past events worth showing.", done: "An editor publishes an event that moves to past events after its date, and an RSVP reaches the CRM tagged with the event." },
        { id: "inquiry", number: "7", group: "pages", name: "Book a call: form to CRM webhook", price: 700, ready: [2,2], readyNote: "Test lead into the CRM", delivers: "A short form for name, mobile, email, buying or selling, timeline, area or price range, best time to call and a message. When it is opened from a profile, listing or event, that agent, listing or event is filled in. On submit, the lead is saved privately and sent to the CRM’s webhook within seconds, with the source page, campaign tags and the SMS consent record. If the CRM does not confirm receipt, the lead is emailed to the broker at once and retried automatically for {retryHours} hours. Spam is filtered before anything reaches the CRM. Includes privacy policy and SMS terms pages drafted for the brokerage to approve, and a thank-you page that can link to the CRM’s booking calendar.", access: "The CRM webhook URL, the fields the CRM and AI follow-up expect, a test contact, a backup email address and approved SMS consent wording.", done: "A test lead sent from a phone appears in the CRM within {leadSeconds} seconds with every agreed field. A lead without SMS consent is marked so the AI does not text it. With the webhook switched off, the lead is emailed and then delivered once the webhook is back on.", note: "Spam filtering matters more than usual here: every fake lead would trigger an AI text." },
        { id: "seo", number: "8", group: "launch", name: "Basic SEO and launch", price: 200, ready: [3,4], delivers: "Page titles and descriptions, social sharing images, an XML sitemap, clean URLs, structured data for the brokerage and its events, Google Search Console and Bing setup, a GA4 lead-conversion event and redirects for up to {redirects} pages of the current site. The footer carries the Equal Housing Opportunity logo and license details. Launch is on the brokerage’s domain, with SSL.", access: "Domain and DNS access, the current site’s address, access to Google accounts, license details and any state-required notices.", done: "Search Console accepts the sitemap, old addresses redirect, a test lead is recorded as a GA4 conversion, and the site loads over HTTPS on the brokerage’s domain." },

      costNotes: [
        "<strong>Hosting:</strong> Netlify’s Personal plan is $9 a month and Pro is $20. The free plan has a hard monthly usage cap that a business site can outgrow, so it isn’t relied on. Photos and videos are served by Sanity, which keeps hosting usage low.",
        "<strong>Free plans:</strong> Sanity’s free plan covers up to 20 editors, and Resend’s covers 3,000 emails a month. Turnstile is free. If lead emails ever outgrow Resend’s free plan, its paid plan is $20 a month.",
        "<strong>IDX (Option B):</strong> IDX Broker’s plans run $60–149 a month, plus a setup fee of up to $100. iHomefinder prices by quote; its entry plan has been listed at about $169 a month. The provider is chosen in week 1, once the MLS is known. MLS fees vary, and some MLSs charge nothing for IDX.",
        "<strong>Not included:</strong> domain renewal (usually $15–25 a year), CRM and AI texting costs, and paid stock photos."
      ],

        { name: "Sanity", role: "Content editing for team profiles, listings, testimonials, events and page text.", status: "Free plan, up to 20 editors", detail: "Holds public content only. Leads are never stored in Sanity." },

        { name: "IDX Broker or iHomefinder", role: "Option B: MLS search, listing pages, saved searches, alerts and sign-ups.", status: "Brokerage subscription", detail: "Needs the broker’s MLS approval. Chosen in week 1 on MLS coverage and price." },

      rules: [
        "<strong>SMS consent:</strong> an optional, unchecked box names the brokerage and states message frequency, “Msg & data rates may apply” and “Reply STOP to opt out, HELP for help”, with a link to the privacy policy. Wireless carriers check this form when they approve the texting number’s 10DLC registration. The wording is final once the brokerage approves it. Texting rules after the lead arrives, such as quiet hours and opt-outs, are handled by the texting platform.",
        "<strong>Privacy:</strong> the privacy policy states that mobile numbers and consent are not shared with third parties for marketing. Leads are kept only in the hosting account and the CRM.",
        "<strong>MLS display (Option B):</strong> the IDX provider applies the MLS’s rules, including credit to the listing firm, required disclaimers and refreshing the data at least every 12 hours.",
        "<strong>Fair housing and licensing:</strong> the footer shows the Equal Housing Opportunity logo, the brokerage’s name and license numbers, and any notices the state requires (Texas, for example, requires links to its brokerage-services and consumer-protection notices).",
        "<strong>Testimonials:</strong> reviews come from real clients, with their written permission. The site adds no review-star markup, because Google does not show stars for a business’s reviews of itself.",
        "<strong>Accessibility:</strong> built to WCAG 2.2 AA basics: color contrast, keyboard use, form labels, image descriptions, and captions where a video has them. This is not a formal audit.",
        "<strong>Listing photos (Option A):</strong> photos must be ones the brokerage owns or is licensed to use, not copies from the MLS or property portals."

      const cents = (v) => Math.round(v*100);
      const sum = (a) => a.reduce((x,y)=>x+y,0);

      const numWord = (n,cap) => { const w=["zero","one","two","three","four","five","six","seven","eight","nine","ten"][n]??String(n); return cap?w.charAt(0).toUpperCase()+w.slice(1):w; };

      const fullDay = (iso) => fmt(iso,{weekday:"long",month:"long",day:"numeric"});
      const dayDate = (iso) => fmt(iso,{weekday:"short",month:"short",day:"numeric"});
      const workday = (w,d) => addDays(S.kickoff,(w-1)*7+d);
      const weekRange = (w) => { const a=workday(w,0), b=workday(w,4); const am=fmt(a,{month:"short"}), bm=fmt(b,{month:"short"}); return am===bm?`${am} ${fmt(a,{day:"numeric"})}–${fmt(b,{day:"numeric"})}`:`${am} ${fmt(a,{day:"numeric"})}–${bm} ${fmt(b,{day:"numeric"})}`; };
      const icons = {

      const items = P.items.map(i => ({...i, monthly: [0,1].map(k => sum(P.services.filter(s=>s.item===i.id).map(s=>cents(s.monthly[k])))/100) }));

      function validateAndBuild() {
        assert(itemMap.size===P.items.length,"Item IDs must be unique.");
        assert(T.kickoffPercent+T.acceptancePercent===100,"Payment shares must total 100%.");
        assert(toDate(M.validUntil)>=toDate(M.issued),"Validity date precedes issue date.");
        assert(toDate(S.kickoff).getUTCDay()===1,"Kickoff must be a Monday.");

        assert(toDate(S.launch)<=toDate(S.deadline),"Launch falls after the deadline.");
        assert(toDate(S.idxCutoff)<toDate(S.launch),"IDX cutoff must precede launch.");

          assert(i.delivers&&i.access&&i.done,`${i.id}: missing scope field.`);

        });
        P.services.forEach(s=>{ assert(itemMap.has(s.item),`Service maps to unknown item ${s.item}.`); assert(s.monthly[0]<=s.monthly[1],`${s.name}: invalid range.`); });
        P.dependencies.forEach(d=>{ assert(!d.item||itemMap.has(d.item),`Dependency maps to unknown item ${d.item}.`); assert(d.due[0]>=1&&d.due[0]<=P.weeks.length,`Dependency due outside the plan.`); });
        P.options.forEach(o=>{
          assert(!model.has(o.id),"Option IDs must be unique.");
          assert(!o.base||model.has(o.base),`${o.id}: base must precede option.`);

          assert(new Set(ids).size===ids.length,`${o.id}: duplicate item.`);
          ids.forEach(id=>assert(itemMap.has(id),`${o.id}: unknown item ${id}.`));
          const list=ids.map(id=>itemMap.get(id));
          assert(sum(list.map(i=>cents(i.price)))===cents(o.price),`${o.id}: item prices do not add up to the option price.`);
          const monthly=[0,1].map(k=>sum(list.map(i=>cents(i.monthly[k])))/100);
          const serviceTotal=[0,1].map(k=>sum(P.services.filter(s=>ids.includes(s.item)).map(s=>cents(s.monthly[k])))/100);
          assert(monthly[0]===serviceTotal[0]&&monthly[1]===serviceTotal[1],`${o.id}: running costs do not reconcile.`);
          model.set(o.id,{...o,ids,items:list,monthly});
        });
        assert(items.every(i=>P.options.some(o=>model.get(o.id).ids.includes(i.id))),"Every item must belong to an option.");
      }

      const idxItem = () => itemMap.get("idx");
      const sectionHead = (id,title,...paras) => `<div class="sec-head"><h2 id="${id}">${title}</h2><div>${paras.map(p=>`<p>${p}</p>`).join("")}</div></div>`;

        </article>`;
      }

    <div class="controls"><button type="button" class="ctl" id="theme-toggle"></button><button type="button" class="ctl" id="print-button">${icons.print}<span>Print</span></button></div>
  </div>
</div></header>
<main id="main" tabindex="-1">
  <section class="wrap overview" aria-labelledby="title">
    <div><p class="kicker">${escape(M.kicker)}</p><h1 id="title">${escape(M.heading)}</h1></div>
    <div>
      <ul class="facts">
        <li>Seven pages, designed mobile-first: home, meet the team, listings, testimonials, mission and vision, events, and book a call</li>
        <li>Every inquiry reaches the broker’s CRM by webhook within seconds, so the AI can text back right away</li>
        <li>Two fixed prices: ${dollars(A.price)} with featured listings the team updates, or ${dollars(B.price)} with IDX/MLS home search</li>
        <li>Launch on ${fullDay(S.launch)}, ahead of the ${monthDay(S.deadline)} deadline, with kickoff on ${fullDay(S.kickoff)}</li>
      </ul>
    </div>
    <nav class="toc" aria-labelledby="toc-h"><p class="toc-h" id="toc-h">Quick links</p><ul>${nav.map(([id,t])=>`<li><a href="#${id}">${t}</a></li>`).join("")}</ul></nav>
  </section>

  <section class="section" aria-labelledby="options"><div class="wrap">
    ${sectionHead("options","Options and pricing","Both options include every page and feature in the brief. They differ only in how listings work. The build price is fixed and paid once. Running costs are monthly estimates, paid by the brokerage directly to each provider.")}
    <div class="cmp">
      <div class="cmp-labels" aria-hidden="true"><div class="opt-head"></div><div>Build price, one-time</div><div>Launch</div><div>Estimated running costs</div><div>Includes</div><div>Not included</div><div>Best if</div></div>
      ${os.map(optionCell).join("")}
    </div>
    <div class="cmp-foot"><h3>In both options</h3><ul class="incl">
      <li>Custom, mobile-first design</li>
      <li>The team edits content in Sanity, no developer needed</li>
      <li>Leads reach the CRM within seconds, with retries and email backup</li>
      <li>Spam filtering and SMS consent records</li>
      <li>Basic SEO and lead tracking</li>
      <li>${T.supportMonths} month of support, plus training</li>
    </ul></div>
    <div class="cmp-notes">
      <p>All prices in USD. Running costs are estimates, paid by the brokerage directly to each provider with no markup. Their basis is set out under <a href="#commercial">Costs, compliance and terms</a>.</p>
      <p><strong>Upgrade path:</strong> starting with Option A and adding IDX search later costs the ${dollars(B.price-A.price)} difference (item 3B).</p>
    </div>
  </div></section>

  <section class="section" aria-labelledby="scope"><div class="wrap">
    ${sectionHead("scope","Detailed scope","Each item’s build price, review date and running cost, what is needed from the brokerage, and how the item is accepted. Items 1–7 follow the order of the brief. Item 0 is the shared foundation, and 3A and 3B are the two listings choices.")}
    <div class="scope-tools"><span>Item prices add up to each option’s price. “Ready to review” is when an item can be checked on the staging site; everything goes live together on ${fullDay(S.launch)}. $0 means no running cost.</span><button type="button" class="linkbtn" id="expand-all" aria-controls="scope-list">Expand all</button></div>
    <table class="scope-tbl" role="presentation"><thead><tr><td><div class="srow scope-head" aria-hidden="true"><span>Item</span><span>Build price</span><span>Ready to review</span><span>Running cost</span>${os.map(o=>`<span class="c" title="${escape(o.label)}">${escape(o.short)}</span>`).join("")}<span></span></div></td></tr></thead>
    <tbody id="scope-list">${renderScope()}</tbody></table>
    <div class="gates">
      <p><strong>If MLS approval is late (Option B):</strong> the site still launches on ${fullDay(S.launch)} with featured listings, and IDX search is switched on within ${S.idxSwitchOnDays} business days of approval at no extra cost. Approval usually takes ${S.mlsApproval}, so the broker’s paperwork should go in by ${fullDay(workday(...P.dependencies.find(d=>d.item==="idx").due))}.</p>
      <p><strong>One form, every route:</strong> “Book a call”, agent profiles, listings and event RSVPs all use the same form and webhook. Each lead arrives in the CRM tagged with where it came from, so the CRM can route it and the AI can follow up in context.</p>
    </div>
  </div></section>

  <section class="section" aria-labelledby="delivery"><div class="wrap">
    ${sectionHead("delivery","Delivery and dependencies",escape(timing),`Weeks run Monday to Friday. Thanksgiving falls in week ${S.holidayWeek}, and nothing is due from the brokerage on the Thursday or Friday.`)}
    <div class="part">
      <h3 class="sub">How a lead reaches the CRM</h3>
      <ol class="flow">
        <li><strong>Visitor</strong><p>Taps “Book a call”, contacts an agent, asks about a listing or RSVPs to an event.</p></li>
        <li><strong>Inquiry form</strong><p>Checks the details, filters spam and records whether the visitor agreed to texts.</p></li>
        <li class="ai"><strong>Website</strong><p>Saves the lead and sends it to the CRM webhook within seconds.</p></li>
        <li><strong>CRM</strong><p>The broker’s existing CRM creates or updates the contact with the source, agent, listing, event and consent.</p></li>
        <li><strong>AI text follow-up</strong><p>Texts the lead right away when consent is on file. Already in place, and not part of this build.</p></li>
      </ol>
      <p class="emerg"><strong>If the CRM does not confirm receipt,</strong> the lead is emailed to the broker at once and retried automatically for ${T.retryHours} hours, so no lead is lost. IDX sign-ups (Option B) reach the CRM through the IDX provider instead, usually within minutes.</p>
    </div>
    <div class="part">
      <h3 class="sub">Delivery timeline</h3>
      <div class="tl" role="img" aria-label="Site build from ${monthDay(S.kickoff)} to launch on ${fullDay(S.launch)}; MLS approval for Option B expected during weeks 1 to 3.">
        <span></span>${P.weeks.map(w=>`<span class="wk" aria-hidden="true"><b><span class="w">Week ${w.number} · </span>${weekRange(w.number)}</b><span class="t">${escape(w.title)}</span><small>${escape(w.detail)}</small></span>`).join("")}
        <span class="vn" aria-hidden="true"><span class="vl">Site build</span><span class="vs">Site</span></span><span class="bar" style="grid-column-end:span ${P.weeks.length}" aria-hidden="true"><span class="w">Launch&nbsp;</span>${dayDate(S.launch)}</span>
        <span class="vn" aria-hidden="true"><span class="vl">MLS approval</span><span class="vs">MLS</span></span><span class="bar wait" style="grid-column-end:span 3" aria-hidden="true"><span class="w">Option B:&nbsp;</span>usually ${S.mlsApproval}</span>
      </div>
      <ol class="weeklist" aria-label="Weekly plan">${P.weeks.map(w=>`<li><b>Week ${w.number}, ${weekRange(w.number)}: ${escape(w.title)}</b><span>${escape(w.detail)}${w.number===P.weeks.length?`. Launch ${dayDate(S.launch)}`:""}</span></li>`).join("")}</ol>
      <p class="tl-note">The ${monthDay(S.deadline)} deadline falls on a ${fmt(S.deadline,{weekday:"long"})}. Launching on ${fmt(S.launch,{weekday:"long"})} leaves ${fmt(addDays(S.launch,1),{weekday:"long"})} free for any last fixes.</p>
    </div>
    <div class="part">
      <h3 class="sub">Dependencies</h3>
      <div class="table-wrap"><table class="deps"><caption class="sr-only">What the schedule depends on, and when</caption><thead><tr><th scope="col">Needed</th><th scope="col">Affects</th><th scope="col">Needed by</th><th scope="col">Owner</th></tr></thead><tbody>
        ${P.dependencies.map(d=>{const i=d.item?itemMap.get(d.item):null;const aff=d.affects?d.affects:`Item${d.also?"s":""} ${i.number}${d.also?`, ${d.also}`:""}`;return `<tr><th scope="row">${escape(d.what)}</th><td data-lbl="Affects">${escape(aff)}</td><td data-lbl="Needed by">${dayDate(workday(d.due[0],d.due[1]))}</td><td data-lbl="Owner">${escape(fill(d.status))}</td></tr>`;}).join("")}
      </tbody></table></div>
    </div>
  </div></section>

  <section class="section" aria-labelledby="commercial"><div class="wrap">
    ${sectionHead("commercial","Costs, compliance and terms","Build prices are fixed for the scope described here. Changes to scope, price or schedule are agreed before any extra work starts.","Running costs are estimates based on providers’ published prices in November 2026. Actual charges depend on the plans chosen and on usage, and are paid directly to the providers.")}
    <div class="part">
      <div class="costs">
        <div class="costs-head"><h3 class="sub">Estimated running costs</h3><p class="sub-lede">Monthly estimates, not quotes. Option B’s range is wide until the MLS and IDX provider are confirmed in week 1.</p></div>
        <div class="table-wrap">${renderCosts()}</div>
        <ul class="notes">${P.costNotes.map(n=>`<li>${n}</li>`).join("")}</ul>
      </div>
    </div>
    <div class="part">
      <h3 class="sub">Services and accounts</h3>
      <p class="sub-lede">Every account is set up in the brokerage’s name, or created for transfer, so the brokerage keeps control of its site and data.</p>
      <div class="table-wrap"><table class="vend"><caption class="sr-only">Services, their roles and account terms</caption><thead><tr><th scope="col">Service</th><th scope="col">Role</th><th scope="col">Account and cost</th></tr></thead><tbody>
        ${P.stack.map(t=>`<tr><th scope="row">${escape(t.name)}</th><td>${escape(t.role)}</td><td><span class="st">${escape(t.status)}</span><span class="dt">${escape(t.detail)}</span></td></tr>`).join("")}
      </tbody></table></div>
    </div>
    <div class="part">
      <h3 class="sub">Rules the site is built around</h3>
      <ul class="rules">${P.rules.map(r=>`<li>${r}</li>`).join("")}</ul>
      <p class="rules-foot">These measures support compliance. They are not legal advice, and the brokerage approves the final policy and consent wording.</p>
    </div>
    <div class="part">
      <h3 class="sub">Commercial terms</h3>
      <dl class="terms">
        <div><dt>Payment</dt><dd>${T.kickoffPercent}% at kickoff (${share(A)} for Option A, ${share(B)} for Option B) and ${T.acceptancePercent}% when the site is accepted as live. For Option B, if MLS approval is still pending at launch, ${dollars(idx.price)} of the final payment is invoiced when IDX search goes live, or ${T.holdbackDays} days after launch, whichever comes first.</dd></div>
        <div><dt>Acceptance</dt><dd>The site is accepted as live when the brokerage confirms that the items in the chosen option meet their acceptance criteria. Support continues afterward and does not delay acceptance.</dd></div>
        <div><dt>Revisions</dt><dd>${numWord(T.designRounds,true)} rounds of changes to the home page design, and ${numWord(T.siteRounds)} consolidated round of feedback on the full site before launch. Further rounds or new pages are extra scope.</dd></div>
        <div><dt>Content</dt><dd>The brokerage provides the text, photos, headshots, listings, testimonials (with each client’s permission) and event details. The first set is loaded for the team (up to ${T.initialContent.team} team profiles, ${T.initialContent.listings} listings, ${T.initialContent.testimonials} testimonials and ${T.initialContent.events} events) and lightly edited for fit. Copywriting and photography are not included.</dd></div>
        <div><dt>Support</dt><dd>${numWord(T.supportMonths,true)} month from launch: fixes, updates and help for editors. Ongoing maintenance after that is not included and can be quoted separately. Content changes never need a developer; layout changes and new features do.</dd></div>
        <div><dt>Scope changes</dt><dd>New pages, features or integrations need agreement on price and schedule before the work starts.</dd></div>
        <div><dt>Ownership</dt><dd>The brokerage owns its domain, accounts, content and IDX subscription. The site’s code is handed over in a Git repository once the build is paid in full.</dd></div>
        <div><dt>Not included in the build price</dt><dd>Hosting, IDX, MLS and Zapier fees; domain renewal; CRM and AI texting setup; copywriting and photography; paid ads; ongoing SEO; and legal review of the policies.</dd></div>
        <div><dt>Validity</dt><dd>This quote is valid until ${longDate(M.validUntil)}. The ${monthDay(S.launch)} launch assumes kickoff on ${fullDay(S.kickoff)}; a later start moves the launch date.</dd></div>
      </dl>
    </div>
  </div></section>

  <section class="section" aria-labelledby="work"><div class="wrap">
    ${sectionHead("work","Real estate work","A recent real estate build, made with Next.js. Its lead handling is the same approach proposed for item 7: every request is saved, sent to a CRM by webhook and retried until delivered.")}
    ${P.work.map(w=>`<article class="work">
      <a class="shot" href="${w.url}"><img src="${w.image}" alt="${escape(w.imageAlt)}" width="1280" height="800"></a>
      <div><h3>${escape(w.name)}</h3><p class="site"><a href="${w.url}">${escape(w.host)}</a></p><p class="lede">${escape(w.summary)}</p><ul>${w.points.map(p=>`<li>${escape(p)}</li>`).join("")}</ul><p class="aside">${escape(w.aside)}</p></div>
    </article>`).join("")}
  </div></section>

</main>
<footer class="site-footer"><div class="wrap footer-inner"><span class="identity"><img class="avatar" src="${M.photo}" alt="" width="32" height="32">${escape(M.author)}</span><span>Quote ${escape(M.number)}</span></div></footer>`;
        root.dataset.quoteValidated="true";
      }

      const THEME_KEY="brokerage-proposal-theme";
      const systemDark=matchMedia("(prefers-color-scheme: dark)");
      const effectiveTheme=()=>root.dataset.theme||(systemDark.matches?"dark":"light");
      function syncThemeButton() {
        const dark=effectiveTheme()==="dark";
        const button=$("#theme-toggle");
        if(!button) return;
        button.innerHTML=`${icons[dark?"sun":"moon"]}<span>${dark?"Light":"Dark"}</span>`;
        button.setAttribute("aria-label",`Switch to ${dark?"light":"dark"} theme`);
      }
      const details=()=>Array.from(document.querySelectorAll("details.it"));
      function syncExpandButton(){const b=$("#expand-all");if(!b)return;const all=details().every(d=>d.open);b.textContent=all?"Collapse all":"Expand all";b.setAttribute("aria-expanded",String(all));}
      let printOpened=[];
      function openForPrint(){printOpened=details().filter(d=>!d.open);printOpened.forEach(d=>d.open=true);}
      function restoreAfterPrint(){printOpened.forEach(d=>d.open=false);printOpened=[];syncExpandButton();}
      try {
        validateAndBuild();
        try{const saved=localStorage.getItem(THEME_KEY);if(saved==="light"||saved==="dark")root.dataset.theme=saved;}catch{}
        render();
        syncThemeButton();
        syncExpandButton();
        systemDark.addEventListener("change",syncThemeButton);
        $("#theme-toggle").addEventListener("click",()=>{const next=effectiveTheme()==="dark"?"light":"dark";root.dataset.theme=next;try{localStorage.setItem(THEME_KEY,next);}catch{}syncThemeButton();});
        $("#print-button").addEventListener("click",async()=>{if(document.fonts)await document.fonts.ready;window.print();});
        $("#expand-all").addEventListener("click",()=>{const open=!details().every(d=>d.open);details().forEach(d=>d.open=open);syncExpandButton();});
        details().forEach(d=>d.addEventListener("toggle",syncExpandButton));
        addEventListener("beforeprint",openForPrint);
        addEventListener("afterprint",restoreAfterPrint);
        matchMedia("print").addEventListener("change",e=>e.matches?openForPrint():restoreAfterPrint());
      } catch(error) {
        console.error(error);
        $("#app").innerHTML='<div class="error" role="alert"><h1>The quote needs a data check.</h1><p>A price, date or scope entry could not be validated. Check the PROPOSAL object before sharing this page.</p></div>';
      }
    })();
  </script>
</body>
</html>
